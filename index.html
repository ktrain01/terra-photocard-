<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>我的追星收藏站</title>
<style>
/* 快去写作业 CJK（手写中文） */
@font-face{
  font-family:"KuaiQuXieZuo";
  src:url("https://raw.githack.com/jaywcjlove/free-font/cb48a58/docs/fonts/%E5%BF%AB%E5%8E%BB%E5%86%99%E4%BD%9C%E4%B8%9A/%E5%BF%AB%E5%8E%BB%E5%86%99%E4%BD%9C%E4%B8%9ACJK-Regular.ttf") format("truetype");
  font-display:swap;
}
/* ---------- 主题：深色默认 / 浅色跟随 data-theme ---------- */
:root{
  color-scheme:dark;
  --paper:#000; --card:#1c1c1e; --field:#2c2c2e;
  --ink:#f5f5f7; --muted:#86868b; --dim:#b0b0b5;
  --line:rgba(255,255,255,.12); --hair:rgba(255,255,255,.2);
  --nav:rgba(0,0,0,.72);
  --btn:#f5f5f7; --btn-tx:#000;
  --t1:rgba(255,255,255,.16); --t2:rgba(255,255,255,.07); --t3:rgba(255,255,255,.14);
  --inset:rgba(255,255,255,.06); --press:rgba(255,255,255,.05);
  --cover:linear-gradient(120deg,#232326 0%,#1c1c1e 55%,#101012 100%);
  --shadow:0 8px 20px rgba(0,0,0,.45);
  --sage:#f5f5f7; --sage-bg:rgba(255,255,255,.12); --sage-tx:#f5f5f7;
  --sky:#d0d0d0; --sky-bg:rgba(255,255,255,.08); --sky-tx:#b0b0b5;
  --sun-bg:rgba(255,255,255,.14); --sun-tx:#ffffff;
  --gray-bg:rgba(255,255,255,.06); --gray-tx:#86868b;
  --rose-d:#f5f5f7;
  --hand:"Comico","KuaiQuXieZuo",cursive;
  --num:"KuaiQuXieZuo",cursive;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#f5f5f7; --card:#ffffff; --field:#f5f5f7;
  --ink:#1d1d1f; --muted:#86868b; --dim:#6e6e73;
  --line:rgba(0,0,0,.1); --hair:rgba(0,0,0,.18);
  --nav:rgba(245,245,247,.72);
  --btn:#1d1d1f; --btn-tx:#ffffff;
  --t1:rgba(0,0,0,.08); --t2:rgba(0,0,0,.045); --t3:rgba(0,0,0,.07);
  --inset:rgba(255,255,255,.9); --press:rgba(0,0,0,.04);
  --cover:linear-gradient(120deg,#e9e9ee 0%,#f5f5f7 55%,#e3e3e9 100%);
  --shadow:0 8px 24px rgba(0,0,0,.12);
  --sage:#1d1d1f; --sage-bg:rgba(0,0,0,.06); --sage-tx:#1d1d1f;
  --sky:#6e6e73; --sky-bg:rgba(0,0,0,.045); --sky-tx:#6e6e73;
  --sun-bg:rgba(0,0,0,.07); --sun-tx:#1d1d1f;
  --gray-bg:rgba(0,0,0,.04); --gray-tx:#86868b;
  --rose-d:#1d1d1f;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--sage-bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);
  min-height:100vh;padding-bottom:48px;
  -webkit-font-smoothing:antialiased;
}
header,nav,main{position:relative;z-index:1}
header{background:none;box-shadow:none;padding:26px 20px 4px}
header .hwrap{max-width:640px;margin:0 auto;position:relative}
/* IG 风格头像头：头像 + 数据行 */
.profile-card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;padding-bottom:20px}
.profile-card .cover{height:92px;background:var(--cover)}
.p-row{display:flex;align-items:flex-end;padding:0 22px;margin-top:-38px}
.profile-card .avatar{width:76px;height:76px;border-radius:50%;position:relative;flex:none;
  border:3px solid var(--card);background:var(--sage-bg);cursor:pointer;overflow:hidden;padding:0}
.profile-card .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-card .avatar .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--hand);font-size:32px;color:var(--sage-tx)}
.p-stats{flex:1;display:flex;justify-content:space-around;text-align:center;padding-bottom:6px}
.p-stats .n{font-family:var(--num);font-size:21px;font-weight:700;color:var(--ink);line-height:1}
.p-stats .l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.p-id{padding:12px 22px 0;text-align:left}
.p-id h1{font-family:var(--hand);font-size:26px;font-weight:400;letter-spacing:.04em;color:var(--ink);line-height:1.2}
.p-id p{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:.2em}
header .doodle{display:none}
/* Apple 官网式极简顶部导航 */
nav#tabs{
  position:sticky;top:0;z-index:60;
  background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
nav#tabs .tabbar{max-width:640px;margin:0 auto;display:flex;justify-content:center;gap:clamp(14px,4.5vw,30px);padding:0 20px}
nav#tabs button{
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  padding:15px 2px;font-size:13px;font-family:inherit;font-weight:400;letter-spacing:.08em;white-space:nowrap;
}
nav#tabs button.active{color:var(--ink);font-weight:600}
main{max-width:640px;margin:0 auto;padding:8px 20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}
.toolbar input[type=search],.toolbar select{
  padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  font-size:14px;background:var(--card);outline:none;color:var(--ink);font-family:inherit;
}
.toolbar input[type=search]{flex:1;min-width:150px}
.toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}
.btn{
  border:1px solid transparent;cursor:pointer;border-radius:999px;font-size:14px;font-weight:600;
  padding:10px 22px;color:var(--btn-tx);font-family:inherit;
  background:var(--btn);transition:.15s;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card)}
.btn.small{padding:7px 15px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 14px;text-align:center}
.stat .num{font-family:var(--num);font-size:32px;font-weight:700;color:var(--ink);line-height:1}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;margin-top:14px}
.pcard{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 16px;
  transition:.2s;
}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcard .photo{
  width:100%;aspect-ratio:3/4;border-radius:12px;background:var(--sage-bg);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;overflow:hidden;
}
.pcard .photo img{width:100%;height:100%;object-fit:cover}
.pcard h3{font-size:15px;margin:12px 4px 2px;font-weight:600}
.pcard .meta{font-size:12px;color:var(--muted);margin:3px 4px}
.pcard .price{font-family:var(--num);font-size:22px;font-weight:700;margin:8px 4px 2px;color:var(--ink)}
.pcard .actions{display:flex;gap:8px;margin:10px 4px 0;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:4px 11px;border-radius:999px;font-weight:600;vertical-align:2px}
.badge.own{background:var(--t1);color:var(--ink)}
.badge.wanted{background:var(--t2);color:var(--dim)}
.badge.selling{background:var(--btn);color:var(--btn-tx)}
.badge.sold{background:transparent;border:1px solid var(--line);color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 20px}
.list+.list{margin-top:14px}
.list .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.list .row:last-child{border-bottom:none}
.list .row .grow{flex:1;min-width:160px}
.list .row .t{font-size:15px;font-weight:600}
.list .row .s{font-size:13px;color:var(--muted);margin-top:3px}
.section-title{font-family:var(--hand);font-size:25px;font-weight:400;margin:30px 0 8px;color:var(--ink);letter-spacing:.05em}
.hint{font-size:13px;color:var(--muted);margin:8px 0}

/* ---------- 高级感：入场动效 / 按压反馈 / 层次 ---------- */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .55s cubic-bezier(.2,.7,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:.06s}
#app.enter>*:nth-child(3){animation-delay:.12s}
#app.enter>*:nth-child(4){animation-delay:.18s}
#app.enter>*:nth-child(5){animation-delay:.24s}
#app.enter>*:nth-child(6){animation-delay:.3s}
#app.enter>*:nth-child(7){animation-delay:.36s}
#app.enter>*:nth-child(8){animation-delay:.42s}
.stat,.pcard,.list,.profile-card{box-shadow:inset 0 1px 0 var(--inset)}
.btn:active{transform:scale(.96)}
.pcard:active,.crow:active{transform:scale(.98)}
#modalOverlay.show #modal{animation:pop .32s cubic-bezier(.2,.9,.3,1.15) both}
/* 导航滑动指示条 */
nav#tabs .tabbar{position:relative}
.tabind{position:absolute;bottom:7px;height:2px;background:var(--btn);border-radius:2px;left:0;width:0;
  transition:left .32s cubic-bezier(.3,1.1,.4,1),width .32s cubic-bezier(.3,1.1,.4,1)}
/* iOS 分段选择器 */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-size:13px;padding:7px 16px;
  border-radius:999px;cursor:pointer;font-family:inherit;transition:.2s}
.seg button.on{background:var(--btn);color:var(--btn-tx);font-weight:600}
/* 小卡列表视图 */
.clist{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px;
  box-shadow:inset 0 1px 0 var(--inset)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.crow:last-child{border-bottom:none}
.crow:active{background:var(--press)}
.cth{width:46px;height:60px;border-radius:8px;background:var(--sage-bg);flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
.cth img{width:100%;height:100%;object-fit:cover}
.crow .cg{flex:1;min-width:0}
.crow .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cp{font-family:var(--num);font-weight:700;font-size:15px;flex:none}
/* 配置指南 */
.guide{font-size:13px;line-height:1.75;color:var(--ink)}
.guide h4{font-size:14px;margin:16px 0 4px;font-weight:700}
.guide h4:first-child{margin-top:0}
.guide p{margin:4px 0;color:var(--muted);font-size:13px}
.guide pre{background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:10.5px;overflow-x:auto;margin:8px 0;white-space:pre;font-family:ui-monospace,monospace}
.guide a{color:var(--ink)}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow-y:auto}
#modalOverlay.show{display:flex}
#modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:560px;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{font-family:var(--hand);font-weight:400;font-size:25px;margin-bottom:12px;letter-spacing:.04em}
#modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
#modal input,#modal select,#modal textarea{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  font-size:15px;outline:none;background:var(--field);color:var(--ink);font-family:inherit;
}
#modal input:focus,#modal select:focus,#modal textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}
#modal textarea{resize:vertical;min-height:60px}
#modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal .mbtns{display:flex;gap:10px;margin-top:20px}
#modal .mbtns .btn{flex:1}
#photoPreview{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none;border:1px solid var(--line)}
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(44,44,46,.95);
  color:#fff;padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 信封开场：拉开绳子拆信 */
#envOverlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#101012 0%,#000 72%);z-index:160;display:none;align-items:center;justify-content:center}
#envOverlay.show{display:flex}
#envStage{transition:opacity .5s,transform .5s;text-align:center}
#envStage.gone{opacity:0;transform:scale(.92)}
#envelope{position:relative;width:228px;height:160px;filter:drop-shadow(0 18px 36px rgba(255,255,255,.09))}
#envPocket{position:absolute;inset:0;background:#fbfaf8;border-radius:10px;z-index:1;box-shadow:inset 0 12px 16px -12px rgba(0,0,0,.35)}
#envFlap{position:absolute;top:0;left:0;right:0;height:94px;background:#f1f0ec;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;
  transition:transform .8s cubic-bezier(.65,0,.35,1);z-index:3}
#envClasp{position:absolute;left:50%;top:100%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;
  background:#fbfaf8;border:1.5px solid #e4e2dc;box-shadow:0 2px 5px rgba(0,0,0,.14)}
#envClasp i{display:block;width:8px;height:8px;border-radius:50%;background:#1c1c1e;margin:8.5px auto}
#envString{position:absolute;inset:0;z-index:4;overflow:visible;transition:opacity .4s;touch-action:none}
#envelope.open #envString{opacity:0}
#strKnob{cursor:grab;touch-action:none}
#strKnob:active{cursor:grabbing}
#envHint{color:#fff;font-size:11px;letter-spacing:5px;margin:30px 0 0;opacity:.7;animation:hintFloat 2.4s ease-in-out infinite;transition:opacity .3s}
@keyframes hintFloat{50%{transform:translateY(-4px);opacity:.35}}
#letterOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:150;padding:24px}
#letterOverlay.show{display:flex}
#snowCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#letterCard{position:relative;z-index:1}
#letterCard{background:var(--card);border:1px solid var(--line);border-radius:22px;
  max-width:420px;width:100%;padding:38px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.letter{font-family:var(--hand);font-size:17px;line-height:2.05;color:var(--ink);margin-bottom:26px;min-height:230px;text-align:left}
.letter .stanza{margin:0 0 16px}
.letter .stanza:last-child{margin-bottom:0}
.lw{opacity:0;transition:opacity .35s}
.lcur{display:inline-block;width:2px;height:1.05em;background:var(--ink);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#letterBtn{opacity:0;pointer-events:none;transition:opacity .8s}
.empty{text-align:center;color:var(--muted);padding:48px 10px;font-size:14px}
/* ---------- 切卡详情 ---------- */
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.member-chip{display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);
  padding:7px 6px 7px 14px;border-radius:999px;font-size:13px;font-weight:500}
.member-chip .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid var(--hair)}
.member-chip .x{cursor:pointer;color:var(--muted);padding:2px 8px;border-radius:50%;font-size:15px}
.member-chip .x:hover{color:var(--ink)}
.ocard-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ocard{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ocard .stripe{width:8px;align-self:stretch;flex-shrink:0;opacity:.75}
.ocard-body{flex:1;padding:12px 14px;min-width:0}
.ocard-title{font-size:14px;font-weight:600}
.ocard-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.ocard-meta .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;border:1px solid var(--hair)}
.ocard .x{cursor:pointer;color:var(--muted);padding:12px;font-size:16px;flex-shrink:0}
.ocard .x:hover{color:var(--ink)}
.status-badge{font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer;
  font-weight:600;flex-shrink:0;margin-right:2px;font-family:inherit;border:none}
.st-pending{background:var(--t2);color:var(--dim)}
.st-paid{background:var(--btn);color:var(--btn-tx)}
.st-postage{background:var(--t3);color:var(--ink);animation:pulse-soft 2.2s ease-in-out infinite}
.st-shipped{background:transparent;border:1px solid var(--line);color:var(--muted)}
@keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.55}}
.split-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-top:14px}
.split-box input{padding:11px 16px;border-radius:12px;border:1px solid var(--line);font-size:15px;
  background:var(--field);color:var(--ink);font-family:inherit;outline:none}
.split-box input:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}
.pay-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.pay-card{display:flex;flex-direction:column;align-items:center;background:var(--field);
  border:1px solid var(--line);border-radius:16px;
  padding:14px 18px;min-width:88px;cursor:pointer;transition:.15s}
.pay-card.paid{border-color:var(--sage);background:var(--sage-bg)}
.pay-card .dot{width:26px;height:26px;border-radius:50%;margin-bottom:8px;border:1px solid var(--hair)}
.pay-name{font-size:13px;font-weight:600}
.pay-amt{font-family:var(--num);font-size:17px;color:var(--muted);margin-top:2px;font-weight:700}
.pay-check{font-size:12px;margin-top:6px;font-weight:600;color:var(--muted)}
.pay-card.paid .pay-check{color:var(--sage-tx)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}header h1{font-size:32px}}

/* ---------- 账号 ---------- */
.acct{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}
.acct .t{font-family:var(--hand);font-size:23px;font-weight:400;letter-spacing:.04em}
.acct .s{font-size:13px;color:var(--muted);margin:6px 0}
.acct label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.acct input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  font-size:15px;outline:none;font-family:inherit;color:var(--ink)}
.acct input:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}

/* ---------- 表格导入预览 ---------- */
.imp-row{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.imp-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--sage);flex-shrink:0}
.imp-row select{padding:7px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;background:var(--field);color:var(--ink);font-family:inherit;flex-shrink:0}
.imp-row input[type=text]{flex:1;min-width:110px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-family:inherit;color:var(--ink)}

function yen(n){n=Number(n)||0;return '¥'+n.toLocaleString('zh-CN')}

function seedData(){

    settings:{title:'TERRA',sub:'小卡收藏手帐',contact:'',avatar:'',theme:'auto'},

/* ============ Firebase 配置：把 Firebase 后台的配置贴到这里 ============
   部署指南见同目录 SETUP_GUIDE.md。不填则为本机模式（数据只存浏览器）。 */
const FIREBASE_CONFIG={
  apiKey:"PASTE_HERE",
  authDomain:"PASTE_HERE",
  projectId:"PASTE_HERE",
  storageBucket:"PASTE_HERE",
  messagingSenderId:"PASTE_HERE",
  appId:"PASTE_HERE"
};
const FIREBASE_ON=FIREBASE_CONFIG.apiKey!=="PASTE_HERE";
/* 下载门：填 Terra 的生日（纯数字，如 "20010520"），指南里会出现「下载网页文件」入口，输对生日才能下载。
   留空则不显示下载入口。 */
const DL_PASSWORD="1209";
let fAuth=null,fDb=null,fStorage=null,currentUser=null,cloudTimer=null;

let DB;
try{DB=JSON.parse(localStorage.getItem(LS_KEY))||null}catch(e){DB=null}
if(!DB||!DB.cards){DB=seedData();saveLocal()}
if(!DB.carpools)DB.carpools=[];
/* 不卖卡：旧数据里的在售/已出统一归为已拥有 */
function migrateNoSell(){if(DB&&DB.cards)DB.cards.forEach(c=>{if(c.status==='selling'||c.status==='sold')c.status='own'})}
migrateNoSell();

function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('本地存储空间不足，试试删掉一些照片')}}
function saveDB(){saveLocal();scheduleCloudSync()}

function initFirebase(){
  if(!FIREBASE_ON||typeof firebase==='undefined')return;
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){return}
  fAuth=firebase.auth();fDb=firebase.firestore();fStorage=firebase.storage();
  fAuth.onAuthStateChanged(async(user)=>{
    currentUser=user;
    if(user){
      try{
        const doc=await fDb.collection('users').doc(user.uid).get();
        if(doc.exists&&doc.data()&&doc.data().data&&doc.data().data.cards){
          DB=doc.data().data;if(!DB.carpools)DB.carpools=[];migrateNoSell();saveLocal();toast('云端数据已同步');
        }else{
          await syncToCloud();toast('本机数据已上传到云端');
        }
      }catch(e){toast('云端同步失败，暂用本地数据')}
    }else{
      try{DB=JSON.parse(localStorage.getItem(LS_KEY))||null}catch(e){DB=null}
      if(!DB||!DB.cards){DB=seedData();saveLocal()}
      if(!DB.carpools)DB.carpools=[];
    }
    render();
  });
}

function scheduleCloudSync(){
  if(!currentUser||!fDb)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(syncToCloud,1500);
}

async function syncToCloud(){
  if(!currentUser||!fDb)return;
  try{
    for(const col of ['cards','merch']){
      for(const item of DB[col]){
        if(item.photo&&item.photo.indexOf('data:')===0){
          const ref=fStorage.ref('users/'+currentUser.uid+'/photos/'+item.id+'.jpg');
          await ref.putString(item.photo,'data_url');
          item.photo=await ref.getDownloadURL();
        }
      }
    }
    await fDb.collection('users').doc(currentUser.uid).set({data:DB,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    saveLocal();
  }catch(e){console.warn('cloud sync failed',e)}
}

async function doLogin(){
  const em=val('a_email'),pw=val('a_pw');
  if(!em||!pw){toast('输入邮箱和密码');return}
  try{await fAuth.signInWithEmailAndPassword(em,pw)}
  catch(e){toast('登录失败：'+authErr(e.code))}
}
async function doRegister(){
  const em=val('a_email'),pw=val('a_pw');
  if(!em||!pw){toast('输入邮箱和密码');return}
  if(pw.length<6){toast('密码至少6位');return}
  try{await fAuth.createUserWithEmailAndPassword(em,pw);toast('注册成功，已登录')}
  catch(e){toast('注册失败：'+authErr(e.code))}
}
function doLogout(){if(fAuth)fAuth.signOut().then(()=>toast('已退出登录'))}

  <h4>6. 完成</h4>
  <p>在网站「设置」→ 输入邮箱密码点「注册新账号」→ 以后在任何设备登录这个邮箱，数据都在。第一次登录会自动把本机已有的数据传上云端。</p>

function dlHTML(){
  const v=(document.getElementById('g_pw').value||'').trim();

    a.href=URL.createObjectURL(blob);a.download='TERRA-小卡收藏.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('已开始下载');
  };
  fetch(location.href).then(r=>{if(!r.ok)throw 0;return r.text()}).then(save)
    .catch(()=>save('<!DOCTYPE html>\n'+document.documentElement.outerHTML));
}

/* 信封开场：按住绳子往下拉拆信 */
let envOpened=false,envPull=0;
function showEnvelope(){
  envOpened=false;envPull=0;
  document.getElementById('envOverlay').classList.add('show');
  const knob=document.getElementById('strKnob');
  let dragging=false,startY=0,basePull=0,moved=0;
  const setPull=p=>{
    envPull=Math.max(0,Math.min(100,p));
    const kx=48+envPull*0.12,ky=116+envPull;
    knob.setAttribute('cx',kx);knob.setAttribute('cy',ky);
    document.getElementById('strPath').setAttribute('d',
      'M114,94 Q'+(84+envPull*0.25)+','+(102+envPull*0.55)+' '+kx+','+ky);
    if(!envOpened)document.getElementById('envFlap').style.transform=
      'rotateX('+(-Math.min(envPull*0.22,24))+'deg)';
    document.getElementById('envHint').style.opacity=String(Math.max(0,.7-envPull/110));
  };
  knob.onpointerdown=e=>{dragging=true;moved=0;startY=e.clientY;basePull=envPull;knob.setPointerCapture&&knob.setPointerCapture(e.pointerId)};
  knob.onpointermove=e=>{
    if(!dragging||envOpened)return;
    const dy=e.clientY-startY;moved=Math.max(moved,Math.abs(dy));
    setPull(basePull+dy);
  };
  knob.onpointerup=()=>{
    if(!dragging)return;dragging=false;
    if(envOpened)return;
    if(moved<6||envPull>=65)openEnvelope();
    else setPull(0);
  };
}
function openEnvelope(){
  if(envOpened)return;envOpened=true;
  const flap=document.getElementById('envFlap');
  flap.style.transform='rotateX(-180deg)';
  document.getElementById('envelope').classList.add('open');
  document.getElementById('envHint').style.opacity='0';
  setTimeout(()=>{
    document.getElementById('envStage').classList.add('gone');
    setTimeout(()=>{
      document.getElementById('envOverlay').classList.remove('show');
      showLetter();
    },520);
  },850);
}

/* 信纸星星雪 */
let snowRAF=null;
function snowStart(){
  const cv=document.getElementById('snowCv');if(!cv)return;
  const ctx=cv.getContext('2d'),ov=document.getElementById('letterOverlay');
  cv.width=ov.clientWidth;cv.height=ov.clientHeight;
  const P=[];
  for(let i=0;i<70;i++){
    const star=Math.random()<0.35;
    P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:star?2+Math.random()*2.5:1+Math.random()*2,
      vy:star?0.25+Math.random()*0.4:0.5+Math.random()*1.1,
      sway:Math.random()*1.2,ph:Math.random()*6.28,
      o:0.35+Math.random()*0.55,star});
  }
  const tick=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    const t=Date.now()/1000;
    for(const p of P){
      p.y+=p.vy;p.ph+=0.02;
      if(p.y>cv.height+8){p.y=-8;p.x=Math.random()*cv.width}
      const x=p.x+Math.sin(p.ph)*p.sway*14;
      ctx.globalAlpha=p.o*(p.star?(0.55+0.45*Math.sin(t*2.4+p.ph*3)):1);
      ctx.fillStyle='#fff';
      if(p.star){
        const r=p.r*(0.8+0.4*Math.sin(t*2+p.ph));
        ctx.beginPath();
        ctx.moveTo(x,p.y-r*2.2);ctx.quadraticCurveTo(x,p.y,x+r*2.2,p.y);
        ctx.quadraticCurveTo(x,p.y,x,p.y+r*2.2);ctx.quadraticCurveTo(x,p.y,x-r*2.2,p.y);
        ctx.quadraticCurveTo(x,p.y,x,p.y-r*2.2);ctx.fill();
      }else{ctx.beginPath();ctx.arc(x,p.y,p.r,0,6.29);ctx.fill()}
    }
    ctx.globalAlpha=1;
    snowRAF=requestAnimationFrame(tick);
  };
  snowStop();tick();
}
function snowStop(){if(snowRAF)cancelAnimationFrame(snowRAF);snowRAF=null}

/* 照片压缩后转 dataURL，省空间 */
function compressImage(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=800;let w=img.width,h=img.height;
        if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=()=>res('');
      img.src=e.target.result;
    };
    r.onerror=()=>res('');
    r.readAsDataURL(file);
  });
}

window.addEventListener('resize',moveInd);
function goTab(k){curTab=k;renderTabs();enterAnim();render()}
function enterAnim(){const a=document.getElementById('app');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter')}
/* 外观：跟随系统 / 深色 / 浅色 */
function applyTheme(){
  const t=(DB.settings&&DB.settings.theme)||'auto';
  let dark=t==='dark';
  if(t!=='dark'&&t!=='light'&&typeof matchMedia!=='undefined')dark=matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc)mc.setAttribute('content',dark?'#000000':'#f5f5f7');
}
function setTheme(t){DB.settings.theme=t;saveDB();applyTheme();renderSettings()}
if(typeof matchMedia!=='undefined')matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
/* 头像：点击更换，存 settings.avatar */
function renderAvatar(){
  const b=document.getElementById('avatarBtn'),a=DB.settings.avatar;
  b.innerHTML=a?`<img src="${a}" alt="头像">`:`<span class="ph">${esc(String(DB.settings.title||'T').trim()[0]||'T')}</span>`;
}
async function onAvatarFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const d=await compressImage(f);
  if(d){DB.settings.avatar=d;saveDB();renderAvatar();toast('头像已更换')}
  inp.value='';
}
function clearAvatar(){DB.settings.avatar='';saveDB();render();toast('已移除头像')}
function render(){
  applyTheme();
  document.getElementById('siteTitle').textContent=DB.settings.title||'TERRA';
  document.getElementById('siteSub').textContent=DB.settings.sub||'';
  renderAvatar();
  const ownN=DB.cards.filter(c=>c.status==='own').length,
    wantN=DB.cards.filter(c=>c.status==='wanted').length;
  document.getElementById('hdStats').innerHTML=
    `<div><div class="n">${ownN}</div><div class="l">小卡</div></div>`+
    `<div><div class="n">${wantN}</div><div class="l">求购中</div></div>`+
    `<div><div class="n">${DB.wishlist.length}</div><div class="l">心愿单</div></div>`;
  document.title=(DB.settings.title||'TERRA').replace(/[^\u0000-\uFFFF]/g,'').trim()||'我的追星收藏站';
  ({overview:renderOverview,cards:renderCards,carpool:renderCarpools,orders:renderOrders,merch:renderMerch,wishlist:renderWishlist,settings:renderSettings})[curTab]();
}

/* ============ 概览 ============ */
function renderOverview(){
  const cards=DB.cards,ownN=cards.filter(c=>c.status==='own').length,
    wantN=cards.filter(c=>c.status==='wanted').length,
    spent=cards.reduce((s,c)=>s+(+c.price||0),0)+DB.merch.reduce((s,m)=>s+(+m.price||0),0)+DB.orders.reduce((s,o)=>s+(+o.amount||0),0);
  document.getElementById('app').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="num">${ownN}</div><div class="lbl">已拥有小卡</div></div>
      <div class="stat"><div class="num">${wantN}</div><div class="lbl">求购中</div></div>
      <div class="stat"><div class="num">${DB.merch.length}</div><div class="lbl">周边</div></div>
      <div class="stat"><div class="num">${yen(spent)}</div><div class="lbl">累计花费</div></div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="editCard()">+ 添加小卡</button>
      <button class="btn ghost" onclick="editOrder()">+ 切卡记录</button>
      <button class="btn ghost" onclick="editCarpool()">+ 拼车</button>
      <button class="btn ghost" onclick="openDocImport()">表格导入</button>
      <button class="btn ghost" onclick="exportJSON()">导出备份</button>
    </div>
        ${FIREBASE_ON&&!currentUser?`<div class="acct"><div class="t">还没登录</div><div class="s">登录后数据自动同步到云端，换设备登录账号就能用</div><div class="toolbar" style="margin:10px 0 0"><button class="btn small" onclick="goTab('settings')">去登录</button></div></div>`:''}`;
}

/* ============ 小卡 ============ */
let cardView=localStorage.getItem('terra_cv')||'grid';
function setCardView(v){cardView=v;localStorage.setItem('terra_cv',v);renderCards()}
function renderCards(){
  const members=[...new Set(DB.cards.map(c=>c.member).filter(Boolean))];
  const q=cardFilter.q.toLowerCase();
  const list=DB.cards.filter(c=>
    (!cardFilter.status||c.status===cardFilter.status)&&
    (!cardFilter.member||c.member===cardFilter.member)&&
    (!q||(c.name+c.member+c.album+c.version+c.note).toLowerCase().includes(q)));
  document.getElementById('app').innerHTML=`
    <div class="toolbar">
      <input type="search" placeholder="搜索卡名 / 成员 / 专辑…" value="${esc(cardFilter.q)}" oninput="cardFilter.q=this.value;renderCards()">
      <select onchange="cardFilter.status=this.value;renderCards()">
        <option value="">全部状态</option>${Object.entries(CARD_STATUS).map(([k,v])=>`<option value="${k}" ${cardFilter.status===k?'selected':''}>${v}</option>`).join('')}
      </select>
      <select onchange="cardFilter.member=this.value;renderCards()">
        <option value="">全部成员</option>${members.map(m=>`<option ${cardFilter.member===m?'selected':''}>${esc(m)}</option>`).join('')}
      </select>
      <div class="seg">
        <button class="${cardView==='grid'?'on':''}" onclick="setCardView('grid')">网格</button>
        <button class="${cardView==='list'?'on':''}" onclick="setCardView('list')">列表</button>
      </div>
      <button class="btn" onclick="editCard()">+ 添加</button>
    </div>
    ${list.length?(cardView==='list'
      ?`<div class="clist">`+list.map(c=>`
      <div class="crow" onclick="editCard('${c.id}')">
        <div class="cth">${c.photo?`<img src="${c.photo}" alt="">`:'<span>无图</span>'}</div>
        <div class="cg"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.member||'')}${c.album?' · '+esc(c.album):''}</div></div>
        <div class="cp">${c.price?yen(c.price):''}</div>
        <span class="badge ${c.status}">${CARD_STATUS[c.status]}</span>
      </div>`).join('')+`</div>`
      :`<div class="grid">`+list.map(c=>`
      <div class="pcard">
        <div class="photo">${c.photo?`<img src="${c.photo}" alt="">`:'no photo yet'}</div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${esc(c.member||'')} ${esc(c.album||'')}</div>
        <div class="meta">${esc(c.version||'')}${c.channel?' · '+esc(c.channel):''}${c.date?' · '+esc(c.date):''}</div>
        <div class="price">${c.price?yen(c.price):'—'} <span class="badge ${c.status}">${CARD_STATUS[c.status]}</span></div>
        ${c.note?`<div class="meta">${esc(c.note)}</div>`:''}
        <div class="actions">
          <button class="btn small ghost" onclick="editCard('${c.id}')">编辑</button>
          <button class="btn small ghost" onclick="delItem('cards','${c.id}')">删除</button>
        </div>
      </div>`).join('')+`</div>`):`<div class="empty">还没有小卡，点击「＋ 添加」开始记录吧</div>`}`;
}
function editCard(id){
  const c=id?DB.cards.find(x=>x.id===id):{status:'own',channel:'韩国'};
  openModal(id?'编辑小卡':'添加小卡',`
    <label>卡名 *</label><input id="f_name" value="${esc(c.name||'')}" placeholder="例：初雪特典卡">
    <div class="row2">
      <div><label>成员</label><input id="f_member" value="${esc(c.member||'')}" placeholder="例：成员A"></div>
      <div><label>专辑 / 活动</label><input id="f_album" value="${esc(c.album||'')}" placeholder="例：《迷你2辑》"></div>
    </div>
    <div class="row2">
      <div><label>版本</label><input id="f_version" value="${esc(c.version||'')}" placeholder="例：预售特典 / 签售"></div>
      <div><label>购买渠道</label><select id="f_channel">${['韩国','日本','国内','其他'].map(ch=>`<option ${c.channel===ch?'selected':''}>${ch}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div><label>购入价 (¥)</label><input id="f_price" type="number" min="0" value="${c.price||''}"></div>
      <div><label>购入日期</label><input id="f_date" type="date" value="${esc(c.date||'')}"></div>
    </div>
    <div><label>状态</label><select id="f_status">${Object.entries(CARD_STATUS).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <label>备注</label><textarea id="f_note" placeholder="卖家、瑕疵、物流…">${esc(c.note||'')}</textarea>
    ${photoFieldHTML(c.photo)}
  `,()=>{
    const name=val('f_name');if(!name){toast('卡名不能为空');return false}
    Object.assign(c,{name,member:val('f_member'),album:val('f_album'),version:val('f_version'),
      channel:val('f_channel'),price:+val('f_price')||0,
      status:val('f_status'),date:val('f_date'),note:val('f_note'),photo:val('f_photoData')});
    if(!id){c.id=uid();DB.cards.unshift(c)}
    saveDB();renderCards();toast(id?'已更新':'已添加');return true;
  });
  bindPhoto();
}
function delItem(key,id){
  const names={cards:'这张小卡',orders:'这条切卡记录',carpools:'这次拼车',merch:'这个周边',wishlist:'这条心愿'};
  if(!confirm(`确定删除${names[key]}吗？`))return;
  DB[key]=DB[key].filter(x=>x.id!==id);saveDB();render();toast('已删除');
}

/* ============ 切卡记录 ============ */

    <p class="hint">点一条记录进入详情，管理组员、卡片状态和补邮分账 ～</p>
    ${DB.orders.length?`<div class="list">`+DB.orders.map(o=>{

      <div class="row">
        <div class="grow" onclick="renderOrderDetail('${o.id}')" style="cursor:pointer">

          <div class="s">${esc(o.items||'')}${o.amount?' · '+yen(o.amount):''}${o.date?' · '+esc(o.date):''}</div>

        <button class="btn small ghost" onclick="event.stopPropagation();delItem('orders','${o.id}')">删除</button>
      </div>`}).join('')+`</div>`:`<div class="empty">还没有切卡记录，拼团 / 切卡都记在这里</div>`}`;

/* ============ 切卡详情：组员 + 卡片 + 补邮分账 ============ */
const MEMBER_COLORS=['#f5f5f7','#c7c7cc','#aeaeb2','#8e8e93','#6e6e73','#545456','#636366','#3a3a3c'];
const CARD_ST={pending:['待付','st-pending'],paid:['已付','st-paid'],postage_due:['待补邮','st-postage'],shipped:['已发货','st-shipped']};
const CARD_ST_ORDER=['pending','paid','postage_due','shipped'];

function omembers(o){if(!o.members)o.members=[];return o.members}
function ocards(o){if(!o.cards)o.cards=[];return o.cards}
function omem(o,mid){return omembers(o).find(m=>m.id===mid)}
function fmtSplit(n){return '¥'+(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2})}

function renderOrderDetail(id){
  const o=DB.orders.find(x=>x.id===id);if(!o){goTab('orders');return}
  omembers(o);ocards(o);
  if(!o.postage)o.postage={total:0,paid:{}};
  const total=+o.postage.total||0;
  const per=o.members.length&&total>0?total/o.members.length:0;
  document.getElementById('app').innerHTML=`
    <div class="toolbar">
      <button class="btn ghost" onclick="goTab('orders')">← 返回</button>
      <button class="btn ghost" onclick="editOrder('${o.id}')">编辑团信息</button>
    </div>
    <div class="section-title">${esc(o.title)}</div>
    <p class="hint">${esc(o.items||'')}${o.amount?' · '+yen(o.amount):''} · ${esc(o.status)}${o.date?' · '+esc(o.date):''}</p>

    <div class="section-title">组员</div>
    <div class="legend">
      ${o.members.map(m=>`<div class="member-chip"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}<span class="x" onclick="delMember('${o.id}','${m.id}')">×</span></div>`).join('')}
      <button class="btn small ghost" onclick="addMember('${o.id}')">+ 添加组员</button>
    </div>

    <div class="section-title">卡片 <span class="hint">— 点状态可切换</span></div>
    ${o.cards.length?`<div class="ocard-list">`+o.cards.map(c=>{
      const mem=omem(o,c.memberId),col=mem?mem.color:'#8e8e93',nm=mem?mem.name:'?';
      const [txt,cls]=CARD_ST[c.status]||CARD_ST.pending;
      return `<div class="ocard">
        <div class="stripe" style="background:${col}"></div>
        <div class="ocard-body">
          <div class="ocard-title">${esc(c.title)}</div>
          <div class="ocard-meta"><span class="dot" style="background:${col}"></span>${esc(nm)}${c.price?' · '+yen(c.price):''}</div>
        </div>
        <span class="status-badge ${cls}" onclick="cycleCardStatus('${o.id}','${c.id}')">${txt}</span>
        <span class="x" onclick="delOrderCard('${o.id}','${c.id}')">×</span>
      </div>`}).join('')+`</div>`:`<div class="empty">还没有卡片，先添加组员再记卡吧</div>`}
    <div class="toolbar"><button class="btn small" onclick="addOrderCard('${o.id}')">+ 添加卡片</button></div>

    <div class="section-title">补邮分账</div>
    <div class="split-box">
      <div class="toolbar" style="margin-top:0">
        <input type="number" id="postageInput" placeholder="输入补邮总额 ¥" min="0" value="${total||''}" style="flex:1;min-width:140px">
        <button class="btn small" onclick="calcPostage('${o.id}')">平分</button>
        <button class="btn small ghost" onclick="resetPaid('${o.id}')">重置</button>
      </div>
      ${total>0&&o.members.length?`<div class="pay-grid">`+o.members.map(m=>{
        const paid=!!o.postage.paid[m.id];
        return `<div class="pay-card ${paid?'paid':''}" style="${paid?`border-color:${m.color}`:''}" onclick="togglePaid('${o.id}','${m.id}')">
          <span class="dot" style="background:${m.color}"></span>
          <div class="pay-name">${esc(m.name)}</div>
          <div class="pay-amt">${fmtSplit(per)}</div>
          <div class="pay-check" style="color:${paid?m.color:'var(--muted)'}">${paid?'已付':'待付'}</div>
        </div>`}).join('')+`</div>`
      :`<p class="hint">输入补邮总额并平分，点击组员卡片标记已付 / 未付</p>`}
    </div>`;
}

function addMember(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const name=prompt('组员名字：');if(!name||!name.trim())return;
  const used=omembers(o).map(m=>m.color);
  const color=MEMBER_COLORS.find(c=>!used.includes(c))||MEMBER_COLORS[o.members.length%MEMBER_COLORS.length];
  o.members.push({id:uid(),name:name.trim(),color});
  saveDB();renderOrderDetail(oid);toast('已添加组员');
}
function delMember(oid,mid){
  const o=DB.orders.find(x=>x.id===oid);
  if(ocards(o).some(c=>c.memberId===mid)){toast('这位组员还有卡片，先删卡片');return}
  if(!confirm('删除这位组员？'))return;
  o.members=o.members.filter(m=>m.id!==mid);
  delete o.postage.paid[mid];
  saveDB();renderOrderDetail(oid);toast('已删除');
}
function addOrderCard(oid){
  const o=DB.orders.find(x=>x.id===oid);
  if(!omembers(o).length){toast('先添加组员');return}
  openModal('添加卡片',`
    <label>卡片名称 *</label><input id="f_title" placeholder="例：NCT Dream 限量小卡">
    <div class="row2">
      <div><label>所属组员</label><select id="f_member">${o.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
      <div><label>价格 (¥)</label><input id="f_price" type="number" min="0"></div>
    </div>
    <label>状态</label><select id="f_status">${Object.entries(CARD_ST).map(([k,[t]])=>`<option value="${k}">${t}</option>`).join('')}</select>
  `,()=>{
    const title=val('f_title');if(!title){toast('名称不能为空');return false}
    o.cards.unshift({id:uid(),title,memberId:val('f_member'),price:+val('f_price')||0,status:val('f_status')});
    saveDB();renderOrderDetail(oid);toast('已添加');return true;
  });
}
function cycleCardStatus(oid,cid){
  const o=DB.orders.find(x=>x.id===oid);
  const c=o.cards.find(x=>x.id===cid);
  c.status=CARD_ST_ORDER[(CARD_ST_ORDER.indexOf(c.status)+1)%CARD_ST_ORDER.length];
  saveDB();renderOrderDetail(oid);
}
function delOrderCard(oid,cid){
  const o=DB.orders.find(x=>x.id===oid);
  if(!confirm('删除这张卡片？'))return;
  o.cards=o.cards.filter(c=>c.id!==cid);saveDB();renderOrderDetail(oid);toast('已删除');
}
function calcPostage(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const v=parseFloat(document.getElementById('postageInput').value);
  if(isNaN(v)||v<=0){toast('输入有效的补邮金额');return}
  if(!omembers(o).length){toast('先添加组员');return}
  o.postage.total=v;saveDB();renderOrderDetail(oid);
  toast('已平分，每人 '+fmtSplit(v/o.members.length));
}
function togglePaid(oid,mid){
  const o=DB.orders.find(x=>x.id===oid);
  o.postage.paid[mid]=!o.postage.paid[mid];
  saveDB();renderOrderDetail(oid);
}
function resetPaid(oid){
  const o=DB.orders.find(x=>x.id===oid);
  o.postage.paid={};saveDB();renderOrderDetail(oid);toast('已重置支付状态');
}
function editOrder(id){
const o=id?DB.orders.find(x=>x.id===id):{status:'拼团中'};
openModal(id?'编辑切卡记录':'添加切卡记录',`
<label>团名 / 标题 *</label><input id="f_title" value="${esc(o.title||'')}" placeholder="例：9月韩网切卡团">
<label>参与的卡</label><input id="f_items" value="${esc(o.items||'')}" placeholder="例：成员A 初雪特典卡 ×2">
<div class="row2">
<div><label>金额 (¥)</label><input id="f_amount" type="number" min="0" value="${o.amount||''}"></div>
<div><label>状态</label><select id="f_status">${ORDER_STATUS.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
</div>
<label>日期</label><input id="f_date" type="date" value="${esc(o.date||'')}">
<label>备注</label><textarea id="f_note" placeholder="团长、转运单号…">${esc(o.note||'')}</textarea>
`,()=>{
const title=val('f_title');if(!title){toast('标题不能为空');return false}
Object.assign(o,{title,items:val('f_items'),amount:+val('f_amount')||0,status:val('f_status'),date:val('f_date'),note:val('f_note')});
if(!id){o.id=uid();DB.orders.unshift(o)}
saveDB();renderOrders();toast(id?'已更新':'已添加');return true;
});
}

/* ============ 拼车（拼转运 / 拼邮） ============ */
const CARPOOL_STATUS=['拼车中','已发货','已到货','已完成'];
function cmembers(cp){if(!cp.members)cp.members=[];return cp.members}
function cparcels(cp){if(!cp.parcels)cp.parcels=[];return cp.parcels}
function cmem(cp,mid){return cmembers(cp).find(m=>m.id===mid)}
function cship(cp){if(!cp.shipping)cp.shipping={total:0,paid:{}};return cp.shipping}

function renderCarpools(){
  document.getElementById('app').innerHTML=`
    <div class="toolbar"><button class="btn" onclick="editCarpool()">+ 发起拼车</button></div>
    <p class="hint">拼转运 / 拼邮的车记在这里，点一条进入详情，管理拼车成员和运费分摊 ～</p>
    ${DB.carpools.length?`<div class="list">`+DB.carpools.map(cp=>{
      const mc=cmembers(cp).length, pc=cparcels(cp).length;
      const total=+cship(cp).total||0;
      const per=mc&&total>0?fmtSplit(total/mc):'';
      return `
      <div class="row">
        <div class="grow" onclick="renderCarpoolDetail('${cp.id}')" style="cursor:pointer">
          <div class="t">${esc(cp.title)} <span class="badge ${cp.status==='已完成'?'sold':cp.status==='已到货'?'own':'selling'}">${esc(cp.status)}</span></div>
          <div class="s">${esc(cp.channel||'')}${cp.deadline?' · 截止 '+esc(cp.deadline):''}</div>
          ${cp.note?`<div class="s">${esc(cp.note)}</div>`:''}
          <div class="s">${mc?mc+' 人拼车':'暂无成员'}${per?' · 运费每人 '+per:''}${pc?' · '+pc+' 个包裹':''} · <span style="color:var(--rose-d)">进入详情 →</span></div>
        </div>
        <button class="btn small ghost" onclick="event.stopPropagation();editCarpool('${cp.id}')">编辑</button>
        <button class="btn small ghost" onclick="event.stopPropagation();delItem('carpools','${cp.id}')">删除</button>
      </div>`}).join('')+`</div>`:`<div class="empty">还没有拼车记录</div>`}`;

function addCarMember(cid){
  const cp=DB.carpools.find(x=>x.id===cid);
  const name=prompt('成员名字：');if(!name||!name.trim())return;
  const used=cmembers(cp).map(m=>m.color);
  const color=MEMBER_COLORS.find(c=>!used.includes(c))||MEMBER_COLORS[cp.members.length%MEMBER_COLORS.length];
  cp.members.push({id:uid(),name:name.trim(),color});
  saveDB();renderCarpoolDetail(cid);toast('已添加成员');
}
function delCarMember(cid,mid){
  const cp=DB.carpools.find(x=>x.id===cid);

let docRows=[];
function openDocImport(){
  openModal('从表格文档导入',
    '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">把 Excel / WPS / 备忘录里的表格复制后粘贴进来（带表头最好：图片、卡片名字、状态、金额）。图片粘贴不过来，导入后在小卡里补传照片就行。</div>'
    +'<label>粘贴表格内容</label>'
    +'<textarea id="docText" rows="9" placeholder="图片\t卡片名字\t状态\t金额\n\t初雪特典卡\t已拥有\t¥45"></textarea>',
    ()=>{
      const t=val('docText');
      if(!t){toast('先粘贴表格内容');return false}
      docRows=parseDocTable(t);
      if(!docRows.length){toast('没解析出有效行，检查下格式');return false}
      renderDocPreview();
      return false;
    });
  document.getElementById('modalOk').textContent='开始解析';
}
function parsePrice(s){
  if(s==null)return null;
  const m=String(s).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);
  return m?+m[1]:null;
}
function normStatus(s){
  s=String(s||'');
  if(/求购|想收|想要|蹲|收卡/.test(s))return 'wanted';
  if(/在售|出售|出物|待出/.test(s))return 'own';
  if(/已出|卖掉|已卖|售出/.test(s))return 'own';
  return 'own';
}
function parseDocTable(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!/^\|[\s\-|:]+\|$/.test(l.trim()));
  if(!lines.length)return [];
  const splitRow=l=>{
    if(l.includes('\t'))return l.split('\t').map(s=>s.trim());
    if(l.includes('|')){let p=l.split('|').map(s=>s.trim());if(!p[0])p=p.slice(1);if(p.length&&!p[p.length-1])p=p.slice(0,-1);return p}
    if(l.includes('，')||l.includes(','))return l.split(/，|,/).map(s=>s.trim());
    if(/ {2,}/.test(l))return l.split(/ {2,}/).map(s=>s.trim());
    return [l];
  };
  const rows=lines.map(splitRow).filter(r=>r.length&&r.some(c=>c));
  if(!rows.length)return [];
  const keys={name:['名字','名称','卡名','卡片','标题','品名'],
    status:['状态'],price:['金额','价格','价','¥','￥','元'],
    member:['成员','人物']};
  let colMap=null,startIdx=0;
  if(/名字|名称|卡名|状态|金额|价格|图片|照片/.test(rows[0].join(' '))){
    colMap={};
    rows[0].forEach((c,i)=>{for(const k in keys){if(keys[k].some(w=>c.includes(w))&&colMap[k]===undefined)colMap[k]=i}});
    startIdx=1;
  }
  const out=[];
  const isNumCol=c=>/^[¥￥\d\s.,，]+$/.test(c)&&/\d/.test(c);
  for(let i=startIdx;i<rows.length;i++){
    const cols=rows[i];
    let name='',statusRaw='',priceRaw='',member='';
    if(colMap){
      name=cols[colMap.name]||'';
      statusRaw=colMap.status!==undefined?cols[colMap.status]||'':'';
      priceRaw=colMap.price!==undefined?cols[colMap.price]||'':'';
      member=colMap.member!==undefined?cols[colMap.member]||'':'';
      if(!name)name=(cols.filter(c=>c&&!isNumCol(c)).sort((a,b)=>b.length-a.length)[0]||'');
    }else{
      let pi=-1,si=-1;
      cols.forEach((c,idx)=>{
        if(pi<0&&/[¥￥]/.test(c))pi=idx;
        if(si<0&&/拥有|已收|求购|想收|在售|出售|已出|卖掉|持有/.test(c))si=idx;
      });
      if(pi<0){const ni=cols.findIndex(isNumCol);if(ni>=0)pi=ni}
      priceRaw=pi>=0?cols[pi]:'';
      statusRaw=si>=0?cols[si]:'';
      name=(cols.filter((c,idx)=>idx!==pi&&idx!==si&&c&&!isNumCol(c)).sort((a,b)=>b.length-a.length)[0]||cols[0]||'');
    }
    const price=parsePrice(priceRaw);
    if(!name&&price==null)continue;
    out.push({type:'card',name:name||'(未命名)',member:member,status:normStatus(statusRaw),price:price||0,checked:true});
  }
  return out;
}
function renderDocPreview(){
  const typeOpts={card:'小卡',order:'切卡',merch:'周边',wish:'心愿单'};
  const stOpts={own:'已拥有',wanted:'求购中'};
  document.getElementById('modalTitle').textContent='确认导入（'+docRows.length+' 条）';
  let h='<div style="font-size:13px;color:var(--muted);margin-bottom:8px">核对一下，勾选要导入的行，分类和状态都能改：</div>';
  docRows.forEach((r,i)=>{
    h+='<div class="imp-row'+(r.checked?'':' off')+'" data-i="'+i+'">'
      +'<input type="checkbox"'+(r.checked?' checked':'')+' onchange="docRows['+i+'].checked=this.checked;this.closest(\'.imp-row\').classList.toggle(\'off\',!this.checked)">'
      +'<select onchange="docRows['+i+'].type=this.value">'+Object.keys(typeOpts).map(k=>'<option value="'+k+'"'+(r.type===k?' selected':'')+'>'+typeOpts[k]+'</option>').join('')+'</select>'
      +'<input type="text" value="'+esc(r.name)+'" oninput="docRows['+i+'].name=this.value" placeholder="名字">'
      +'<input type="text" value="'+esc(r.member)+'" oninput="docRows['+i+'].member=this.value" placeholder="成员" style="max-width:64px;flex:0 1 64px">'
      +'<select onchange="docRows['+i+'].status=this.value">'+Object.keys(stOpts).map(k=>'<option value="'+k+'"'+(r.status===k?' selected':'')+'>'+stOpts[k]+'</option>').join('')+'</select>'
      +'<input type="number" value="'+(r.price||'')+'" oninput="docRows['+i+'].price=+this.value||0" placeholder="¥">'
      +'</div>';
  });
  document.getElementById('modalBody').innerHTML=h;
  const ok=document.getElementById('modalOk');
  ok.textContent='确认导入';
  ok.onclick=()=>{confirmDocImport()};
}
function confirmDocImport(){
  const rows=docRows.filter(r=>r.checked&&String(r.name).trim());
  if(!rows.length){toast('没有勾选任何行');return}
  let n=0;
  for(const r of rows){
    const name=String(r.name).trim(),price=+r.price||0,member=String(r.member||'').trim();
    if(r.type==='order')DB.orders.push({id:uid(),title:name,items:'',amount:price,status:'拼团中',date:'',note:'从表格导入',members:[],cards:[],postage:{total:0,paid:{}}});
    else if(r.type==='merch')DB.merch.push({id:uid(),name:name,type:'周边',price:price,channel:'',date:'',note:'从表格导入',photo:''});
    else if(r.type==='wish')DB.wishlist.push({id:uid(),name:name,member:member,album:'',targetPrice:price,note:'从表格导入'});
    else DB.cards.push({id:uid(),name:name,member:member,album:'',version:'',price:price,status:r.status||'own',channel:'',date:'',note:'从表格导入',photo:''});
    n++;
  }
  saveDB();closeModal();render();toast('已导入 '+n+' 条记录');
}

/* ============ 启动 ============ */
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
initFirebase();renderTabs();enterAnim();render();
try{if(!localStorage.getItem('terra_letter'))showEnvelope()}catch(e){}
