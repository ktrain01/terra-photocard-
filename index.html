<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>TERRA</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ---------- 主题：深色默认 / 浅色跟随 data-theme ---------- */
:root{
  color-scheme:dark;
  --paper:#000; --card:#1c1c1e; --field:#2c2c2e;
  --ink:#f5f5f7; --muted:#86868b; --dim:#b0b0b5;
  --line:rgba(255,255,255,.12); --hair:rgba(255,255,255,.2);
  --nav:rgba(0,0,0,.72);
  --btn:#f5f5f7; --btn-tx:#000;
  --t1:rgba(255,255,255,.16); --t2:rgba(255,255,255,.07); --t3:rgba(255,255,255,.14);
  --inset:rgba(255,255,255,.06); --press:rgba(255,255,255,.05);
  --cover:linear-gradient(120deg,#232326 0%,#1c1c1e 55%,#101012 100%);
  --shadow:0 8px 20px rgba(0,0,0,.45);
  --sage:#f5f5f7; --sage-bg:rgba(255,255,255,.12); --sage-tx:#f5f5f7;
  --sky:#d0d0d0; --sky-bg:rgba(255,255,255,.08); --sky-tx:#b0b0b5;
  --sun-bg:rgba(255,255,255,.14); --sun-tx:#ffffff;
  --gray-bg:rgba(255,255,255,.06); --gray-tx:#86868b;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --hand:var(--font); --num:var(--font);
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#f5f5f7; --card:#ffffff; --field:#f5f5f7;
  --ink:#1d1d1f; --muted:#86868b; --dim:#6e6e73;
  --line:rgba(0,0,0,.1); --hair:rgba(0,0,0,.18);
  --nav:rgba(245,245,247,.72);
  --btn:#1d1d1f; --btn-tx:#ffffff;
  --t1:rgba(0,0,0,.08); --t2:rgba(0,0,0,.045); --t3:rgba(0,0,0,.07);
  --inset:rgba(255,255,255,.9); --press:rgba(0,0,0,.04);
  --cover:linear-gradient(120deg,#e9e9ee 0%,#f5f5f7 55%,#e3e3e9 100%);
  --shadow:0 8px 24px rgba(0,0,0,.12);
  --sage:#1d1d1f; --sage-bg:rgba(0,0,0,.06); --sage-tx:#1d1d1f;
  --sky:#6e6e73; --sky-bg:rgba(0,0,0,.045); --sky-tx:#6e6e73;
  --sun-bg:rgba(0,0,0,.07); --sun-tx:#1d1d1f;
  --gray-bg:rgba(0,0,0,.04); --gray-tx:#86868b;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--sage-bg)}
body{
  font-family:var(--font);
  background:var(--paper);color:var(--ink);
  min-height:100vh;padding-bottom:48px;
  -webkit-font-smoothing:antialiased;
}
header,nav,main{position:relative;z-index:1}
header{padding:36px 20px 12px;text-align:center}
header .hwrap{max-width:640px;margin:0 auto}
.phead{background:var(--card);border-radius:24px;overflow:hidden}
.coverbar{height:clamp(96px,22vw,148px);background:var(--cover);background-size:cover;background-position:center;cursor:pointer}
.profile{display:flex;flex-direction:row;align-items:center;gap:14px;position:relative;margin-top:-30px;padding:0 20px 2px;text-align:left}
.profile .avatar{width:60px;height:60px;flex:none;margin:0;box-shadow:0 0 0 4px var(--card)}
.profile .avatar .ph{font-size:24px}
.profile h1{font-size:20px;margin:0}
.profile p{margin-top:4px}
.profile .avatar{width:88px;height:88px;border-radius:50%;border:none;background:var(--field);cursor:pointer;overflow:hidden;padding:0;flex:none}
.profile .avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile .avatar .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;color:var(--dim)}
.p-stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.p-stats .n{font-family:var(--num);font-size:21px;font-weight:700;color:var(--ink);line-height:1}
.p-stats .l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.p-id{padding:8px 20px 18px;text-align:left}
.p-id h1{font-size:24px;font-weight:600;letter-spacing:.01em;color:var(--ink);line-height:1.2}
.p-id p{color:var(--muted);font-size:13px;margin-top:6px;letter-spacing:.04em}
/* Apple 官网式极简顶部导航 */
nav#tabs{
  position:sticky;top:0;z-index:60;
  background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
nav#tabs .tabbar{max-width:640px;margin:0 auto;display:flex;justify-content:safe center;gap:clamp(18px,5vw,32px);padding:0 20px;overflow-x:auto;scrollbar-width:none}
nav#tabs button{
  border:none;background:transparent;color:var(--muted);cursor:pointer;
  padding:15px 2px;font-size:13px;font-family:inherit;font-weight:400;letter-spacing:.03em;white-space:nowrap;flex:none;
}
nav#tabs button.active{color:var(--ink);font-weight:600}
main{max-width:640px;margin:0 auto;padding:20px 20px 8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}
.toolbar input[type=search],.toolbar select{
  padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  font-size:14px;background:var(--card);outline:none;color:var(--ink);font-family:inherit;
}
.toolbar input[type=search]{flex:1;min-width:150px}
.toolbar input[type=search]:focus,.toolbar select:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}
.btn{
  border:1px solid transparent;cursor:pointer;border-radius:999px;font-size:14px;font-weight:600;
  padding:10px 22px;color:var(--btn-tx);font-family:inherit;
  background:var(--btn);transition:.15s;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card)}
.btn.small{padding:7px 15px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 12px}
.spentbar{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border-radius:16px;padding:14px 18px;margin:0 0 4px}
.spentbar span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.spentbar b{font-family:var(--num);font-size:20px;font-weight:600;letter-spacing:-.01em}
.btn.block{width:100%;padding:14px;font-size:15px}
.stat{background:var(--card);border-radius:20px;padding:24px 14px;text-align:center}
.stat .num{font-family:var(--num);font-size:36px;font-weight:500;letter-spacing:-.02em;color:var(--ink);line-height:1}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:20px;margin-top:20px}
.pcard{
  background:var(--card);border-radius:20px;padding:12px 12px 16px;
  transition:.2s;display:flex;flex-direction:column;
}
.pcard .photo{
  width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--field);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;overflow:hidden;
}
.pcard .photo img{width:100%;height:100%;object-fit:cover}
.pcard h3{font-size:15px;margin:14px 4px 2px;font-weight:500}
.pcard .meta{font-size:12px;color:var(--muted);margin:3px 4px}
.pcard .price{font-family:var(--num);font-size:22px;font-weight:600;margin:8px 4px 2px;color:var(--ink)}
.pcard .actions{display:flex;gap:8px;margin:auto 4px 0;padding-top:10px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:4px 11px;border-radius:999px;font-weight:600;vertical-align:2px}
.badge.own{background:var(--t2);color:var(--dim)}
.badge.wanted{background:var(--t2);color:var(--dim)}
.badge.selling{background:var(--btn);color:var(--btn-tx)}
.badge.sold{background:transparent;border:1px solid var(--line);color:var(--muted)}
.list{background:var(--card);border-radius:20px;padding:2px 20px}
.list+.list{margin-top:14px}
.list .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list .row:last-child{border-bottom:none}
.list .row .grow{flex:1;min-width:160px}
.list .row .t{font-size:15px;font-weight:500}
.list .row .s{font-size:13px;color:var(--muted);margin-top:3px}
.section-title{font-size:22px;font-weight:600;margin:44px 0 12px;color:var(--ink);letter-spacing:-.01em}
.section-title:first-child{margin-top:12px}
.hint{font-size:13px;color:var(--muted);margin:8px 0}

/* ---------- 演唱会 ---------- */
.tcard{background:var(--card);border-radius:20px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start;margin-top:14px}
.tcard .dbox{flex:none;width:64px;height:66px;border-radius:14px;background:var(--btn);color:var(--btn-tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--num)}
.tcard .dbox .d{font-size:24px;font-weight:600;line-height:1}
.tcard .dbox .m{font-size:11px;margin-top:4px;opacity:.7}
.tcard .dbox.none{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;font-family:inherit}
.tcard .grow{flex:1;min-width:0}
.tcard .t{font-size:16px;font-weight:600}
.tcard .s{font-size:13px;color:var(--muted);margin-top:4px}
.tcard .cd{font-size:13px;margin-top:6px;font-weight:600}
.tcard .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tcard .price{font-family:var(--num);font-size:17px;font-weight:600}
.tcard .ops{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tcard .maplink{color:inherit;text-decoration:underline;text-underline-offset:3px}
.tcard .maplink:hover{color:var(--ink)}

/* ---------- 高级感：入场动效 / 按压反馈 / 层次 ---------- */
html{scroll-behavior:smooth}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .4s cubic-bezier(.2,.7,.25,1) both}
#app.enter>*:nth-child(2){animation-delay:0.03s}
#app.enter>*:nth-child(3){animation-delay:0.06s}
#app.enter>*:nth-child(4){animation-delay:0.09s}
#app.enter>*:nth-child(5){animation-delay:0.12s}
#app.enter>*:nth-child(6){animation-delay:0.15s}
#app.enter>*:nth-child(7){animation-delay:0.18s}
#app.enter>*:nth-child(8){animation-delay:0.21s}
.btn:active{transform:scale(.96)}
.pcard:active,.crow:active{transform:scale(.98)}
#modalOverlay.show #modal{animation:pop .32s cubic-bezier(.2,.9,.3,1.15) both}
/* 导航滑动指示条 */
nav#tabs .tabbar{position:relative}
.tabind{position:absolute;bottom:7px;height:2px;background:var(--btn);border-radius:2px;left:0;width:0;
  transition:left .32s cubic-bezier(.3,1.1,.4,1),width .32s cubic-bezier(.3,1.1,.4,1)}
/* iOS 分段选择器 */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-size:13px;padding:7px 16px;
  border-radius:999px;cursor:pointer;font-family:inherit;transition:.2s}
.seg button.on{background:var(--btn);color:var(--btn-tx);font-weight:600}
/* 小卡列表视图 */
.clist{background:var(--card);border-radius:20px;overflow:hidden;margin-top:14px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.crow:last-child{border-bottom:none}
.crow:active{background:var(--press)}
.cth{width:46px;height:60px;border-radius:10px;background:var(--field);flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
.cth img{width:100%;height:100%;object-fit:cover}
.crow .cg{flex:1;min-width:0}
.crow .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cp{font-family:var(--num);font-weight:600;font-size:15px;flex:none}
/* 配置指南 */
.guide{font-size:13px;line-height:1.75;color:var(--ink)}
.guide h4{font-size:14px;margin:16px 0 4px;font-weight:600}
.guide h4:first-child{margin-top:0}
.guide p{margin:4px 0;color:var(--muted);font-size:13px}
.guide pre{background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:10.5px;overflow-x:auto;margin:8px 0;white-space:pre;font-family:ui-monospace,monospace}
.guide a{color:var(--ink)}
#addOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:210;padding:20px}
#addOverlay.show{display:flex}
@keyframes fanIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.fan{width:100%;max-width:448px;padding:0 24px}
.fan-stack{display:flex;flex-direction:column;touch-action:none}
.fan-hint{margin-top:16px;text-align:center;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.55)}
.fan-card{position:relative;height:128px;border:1px solid rgba(127,127,127,.22);border-radius:18px;padding:20px;cursor:pointer;font-family:inherit;text-align:left;background:rgba(17,17,17,.93);color:#f5f5f7;box-shadow:0 16px 34px rgba(0,0,0,.30);transition:transform .18s ease,opacity .18s ease}
.fan-card + .fan-card{margin-top:-64px}
.fan-card:nth-child(1){z-index:1}.fan-card:nth-child(2){z-index:2}.fan-card:nth-child(3){z-index:3}.fan-card:nth-child(4){z-index:4}.fan-card:nth-child(5){z-index:5}.fan-card:nth-child(6){z-index:6}
.fan-stack .fan-card:last-child{will-change:transform}
.fan-card.drag{box-shadow:0 8px 18px rgba(0,0,0,.22)}
#addOverlay.show .fan-card{animation:fanIn .5s cubic-bezier(.2,.7,.3,1) backwards}
.fan-row{display:flex;justify-content:space-between;align-items:baseline}
.fan-name{font-size:17px;font-weight:600}
#addOverlay.picking .fan-card{animation:none;opacity:.55}
#addOverlay.picking .fan-card.on{opacity:1;transform:translateY(-12px) scale(1.02)}
.datefield{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-size:15px;background:var(--field);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.datefield.ph{color:var(--muted)}
#dpOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:220;padding:20px}
#dpOverlay.show{display:flex}
#dpSheet{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:340px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .28s cubic-bezier(.2,.9,.3,1.15) both}
.dp-head{display:flex;align-items:center;gap:2px;margin-bottom:10px}
#dpTitle{flex:1;text-align:center;font-size:16px;font-weight:600;color:var(--ink)}
.dp-nav{border:none;background:transparent;color:var(--muted);font-size:17px;width:34px;height:34px;border-radius:50%;cursor:pointer;font-family:inherit}
.dp-nav:active{background:var(--press)}
.dp-wk,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wk span{text-align:center;font-size:11px;color:var(--muted);padding:5px 0;letter-spacing:.05em}
.dp-cell{border:none;background:transparent;color:var(--ink);font-size:14px;height:40px;border-radius:50%;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
button.dp-cell:active{background:var(--press)}
.dp-cell.today{box-shadow:inset 0 0 0 1px var(--hair)}
.dp-cell.sel{background:var(--btn);color:var(--btn-tx);font-weight:600;box-shadow:none}
.dp-btns{display:flex;align-items:center;gap:8px;margin-top:14px}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:24px 14px;overflow-y:auto}
#modalOverlay.show{display:flex}
#modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:100%;max-width:560px;padding:26px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#modal h2{font-weight:600;font-size:22px;margin-bottom:12px}
#modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
#modal input,#modal select,#modal textarea{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  font-size:15px;outline:none;background:var(--field);color:var(--ink);font-family:inherit;
}
#modal input:focus,#modal select:focus,#modal textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-bg)}
#modal textarea{resize:vertical;min-height:60px}
#modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal .mbtns{display:flex;gap:10px;margin-top:20px}
#modal .mbtns .btn{flex:1}
#photoPreview{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none;border:1px solid var(--line)}
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--btn);
  color:var(--btn-tx);padding:12px 24px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 信封开场：拉开绳子拆信 */
#envOverlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#101012 0%,#000 72%);z-index:160;display:none;align-items:center;justify-content:center}
#envOverlay.show{display:flex}
#envStage{transition:opacity .5s,transform .5s;text-align:center}
#envStage.gone{opacity:0;transform:scale(.92)}
#envelope{position:relative;width:228px;height:160px;filter:drop-shadow(0 18px 36px rgba(255,255,255,.09))}
#envPocket{position:absolute;inset:0;background:#171615;border:1px solid rgba(255,255,255,.22);border-radius:12px;z-index:1;box-shadow:inset 0 12px 16px -12px rgba(0,0,0,.6)}
#envFlap{position:absolute;top:0;left:0;right:0;height:94px;background:#242220;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;
  transition:transform .8s cubic-bezier(.65,0,.35,1);z-index:3}
#envClasp{position:absolute;left:50%;top:100%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;
  background:#171615;border:1.5px solid rgba(255,255,255,.35)}
#envClasp i{display:block;width:8px;height:8px;border-radius:50%;background:#f4f2ee;margin:8.5px auto}
#envString{position:absolute;inset:0;z-index:4;overflow:visible;transition:opacity .4s;touch-action:none}
#envelope.open #envString{opacity:0}
#strKnob{cursor:grab;touch-action:none}
#strKnob:active{cursor:grabbing}
#envHint{color:#fff;font-size:11px;letter-spacing:5px;margin:30px 0 0;opacity:.7;animation:hintFloat 2.4s ease-in-out infinite;transition:opacity .3s}
@keyframes hintFloat{50%{transform:translateY(-4px);opacity:.35}}
#letterOverlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:150;padding:24px}
#letterOverlay.show{display:flex}
#snowCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#letterCard{position:relative;z-index:1;width:min(620px,94vw);
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.07));
  -webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid rgba(255,255,255,.30);border-radius:16px;
  padding:36px 40px 30px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.08)}
.letter{font-family:var(--hand);font-size:16px;line-height:2;color:#fff;margin-bottom:24px;min-height:200px;text-align:left;
  text-shadow:0 1px 10px rgba(0,0,0,.4)}
.letter .stanza{margin:0 0 16px}
.letter .stanza:last-child{margin-bottom:0}
.lw{opacity:0;transition:opacity .35s}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
/* ============ 数据层 ============ */
const LS_KEY='photocard_collect_v1';
const PH_ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>';
const CARD_STATUS={own:'已拥有',wanted:'求购中'};
const ORDER_STATUS=['拼团中','已付款','已到货','已完成'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function yen(n){n=Number(n)||0;return '¥'+n.toLocaleString('zh-CN')}

function seedData(){
  return {
    settings:{title:'TERRA',sub:'小卡收藏手帐',contact:'',avatar:'',cover:'',theme:'auto'},
    cards:[],
    orders:[],
    merch:[],
    carpools:[],
    concerts:[],
    wishlist:[]
  };
}

/* ============ Firebase 配置：把 Firebase 后台的配置贴到这里 ============
   部署指南见同目录 SETUP_GUIDE.md。不填则为本机模式（数据只存浏览器）。 */
const FIREBASE_CONFIG={
  apiKey:"PASTE_HERE",
  authDomain:"PASTE_HERE",
  projectId:"PASTE_HERE",
  storageBucket:"PASTE_HERE",
  messagingSenderId:"PASTE_HERE",
  appId:"PASTE_HERE"
};
const FIREBASE_ON=FIREBASE_CONFIG.apiKey!=="PASTE_HERE";
/* 页面源码快照：脚本刚启动、界面还没渲染时抓取，保证内容干净原始。
   指南第 5 步下载网页文件时，fetch 不可用就用这份快照，
   这样下载到的永远是最新版源码，不会混入当前数据、弹窗状态或翻译后的文字。 */
const PAGE_SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
/* 下载门：填 Terra 的生日（纯数字，如 "20010520"），指南里会出现「下载网页文件」入口，输对生日才能下载。
   留空则不显示下载入口。
   注意：这只是个小心意式的门，密码写在网页源码里，并不能真正保密。 */
const DL_PASSWORD="1209";
let fAuth=null,fDb=null,fStorage=null,currentUser=null,cloudTimer=null;

let DB;
try{DB=JSON.parse(localStorage.getItem(LS_KEY))||null}catch(e){DB=null}
if(!DB||!DB.cards){DB=seedData();saveLocal()}
if(!DB.carpools)DB.carpools=[];
if(!DB.concerts)DB.concerts=[];
if(!DB.settings)DB.settings={};if(!('cover' in DB.settings))DB.settings.cover='';
/* 不卖卡：旧数据里的在售/已出统一归为已拥有 */
function migrateNoSell(){if(DB&&DB.cards)DB.cards.forEach(c=>{if(c.status==='selling'||c.status==='sold')c.status='own'})}
migrateNoSell();

function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('本地存储空间不足，试试删掉一些照片')}}
function saveDB(){saveLocal();scheduleCloudSync()}

function initFirebase(){
  if(!FIREBASE_ON||typeof firebase==='undefined')return;
  try{firebase.initializeApp(FIREBASE_CONFIG)}catch(e){return}
  fAuth=firebase.auth();fDb=firebase.firestore();fStorage=firebase.storage();
  fAuth.onAuthStateChanged(async(user)=>{
    currentUser=user;
    if(user){
      try{
        const doc=await fDb.collection('users').doc(user.uid).get();
        if(doc.exists&&doc.data()&&doc.data().data&&doc.data().data.cards){
          DB=doc.data().data;if(!DB.carpools)DB.carpools=[];if(!DB.concerts)DB.concerts=[];if(!DB.settings)DB.settings={};if(!('cover' in DB.settings))DB.settings.cover='';migrateNoSell();saveLocal();toast('云端数据已同步');
        }else{
          await syncToCloud();toast('本机数据已上传到云端');
        }
      }catch(e){toast('云端同步失败，暂用本地数据')}
    }else{
      try{DB=JSON.parse(localStorage.getItem(LS_KEY))||null}catch(e){DB=null}
      if(!DB||!DB.cards){DB=seedData();saveLocal()}
      if(!DB.carpools)DB.carpools=[];if(!DB.concerts)DB.concerts=[];if(!DB.settings)DB.settings={};if(!('cover' in DB.settings))DB.settings.cover='';
    }
    render();
  });
}

function scheduleCloudSync(){
  if(!currentUser||!fDb)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(syncToCloud,1500);
}

async function syncToCloud(){
  if(!currentUser||!fDb)return;
  try{
    for(const col of ['cards','merch']){
      for(const item of DB[col]){
        if(item.photo&&item.photo.indexOf('data:')===0){
          const ref=fStorage.ref('users/'+currentUser.uid+'/photos/'+item.id+'.jpg');
          await ref.putString(item.photo,'data_url');
          item.photo=await ref.getDownloadURL();
        }
      }
    }
    await fDb.collection('users').doc(currentUser.uid).set({data:DB,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    saveLocal();
  }catch(e){console.warn('cloud sync failed',e)}
}

async function doLogin(){
  const em=val('a_email'),pw=val('a_pw');
  if(!em||!pw){toast('输入邮箱和密码');return}
  try{await fAuth.signInWithEmailAndPassword(em,pw)}
  catch(e){toast('登录失败：'+authErr(e.code))}
}
async function doRegister(){
  const em=val('a_email'),pw=val('a_pw');
  if(!em||!pw){toast('输入邮箱和密码');return}
  if(pw.length<6){toast('密码至少6位');return}
  try{await fAuth.createUserWithEmailAndPassword(em,pw);toast('注册成功，已登录')}
  catch(e){toast('注册失败：'+authErr(e.code))}
}
function doLogout(){if(fAuth)fAuth.signOut().then(()=>toast('已退出登录'))}
/* Firebase 配置指南弹窗 */
function openGuide(){
  openModal('云同步配置指南',`<div class="guide">
  <p>全程约 5 分钟。建议用自己的 Google 账号建项目，这样数据只属于你。</p>
  <h4>1. 创建 Firebase 项目</h4>
  <p>打开 <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> 登录 → 创建项目（名字如 photocard-diary）→ Analytics 关掉 → 创建。然后左上角项目概览 → 点 &lt;/&gt; 注册 Web 应用 → 复制那段 firebaseConfig，第 5 步要用。</p>
  <h4>2. 开启邮箱登录</h4>
  <p>左侧 构建 → Authentication → 开始使用 → 登录方法 → 启用「电子邮件/密码」→ 保存。</p>
  <h4>3. 建数据库（存小卡数据）</h4>
  <p>左侧 构建 → Firestore Database → 创建数据库 → 位置选 asia-east1 → 生产模式启动 → 点「规则」标签，把下面整段粘贴进去 → 发布：</p>
  <pre>rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid} {
      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;
    }
  }
}</pre>
  <p>这条规则的意思：每个人只能读写自己的数据。</p>
  <h4>4. 开文件存储（存照片）</h4>
  <p>左侧 构建 → Storage → 开始使用 → 生产模式启动 → 「规则」标签粘贴下面这段 → 发布：</p>
  <pre>rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /users/{uid}/photos/{file} {
      allow read, write: if request.auth != null &amp;&amp; request.auth.uid == uid;
    }
  }
}</pre>
  <h4>5. 下载网页文件，贴入配置</h4>
  <p>在下面输入你的生日，下载网页文件：</p>
  ${DL_PASSWORD?`
  <div style="display:flex;gap:8px;margin:8px 0">
    <input id="g_pw" type="password" inputmode="numeric" placeholder="输入生日" style="flex:1;min-width:0">
    <button class="btn small" style="flex:none" onclick="dlHTML()">下载</button>
  </div>`:''}
  <p>然后用记事本打开下载好的文件，找到顶部 script 里的 FIREBASE_CONFIG，把 PASTE_HERE 逐个换成第 1 步复制的 firebaseConfig 对应的值，保存。再用浏览器打开这个文件，继续下一步。</p>
  <h4>6. 完成</h4>
  <p>在网站「设置」→ 输入邮箱密码点「注册新账号」→ 以后在任何设备登录这个邮箱，数据都在。第一次登录会自动把本机已有的数据传上云端。</p>
  <p>不配置也能用，但建议每日一备份。</p>
  </div>`,()=>true);
}
/* 生日门：下载原始网页文件（不受弹窗状态和页面翻译影响） */
function dlHTML(){
  const v=(document.getElementById('g_pw').value||'').trim();
  if(v!==DL_PASSWORD){toast('生日不对，再想想');return}
  const save=text=>{
    const blob=new Blob([text],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='TERRA-小卡收藏.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('已开始下载');
  };
  fetch(location.href).then(r=>{if(!r.ok)throw 0;return r.text()}).then(save)
    .catch(()=>save(PAGE_SRC));
}
function authErr(code){
  const m={'auth/invalid-email':'邮箱格式不对','auth/user-not-found':'账号不存在，请先注册','auth/wrong-password':'密码错误','auth/email-already-in-use':'邮箱已注册，直接登录','auth/weak-password':'密码强度不够','auth/too-many-requests':'尝试太多次，稍后再试','auth/network-request-failed':'网络连接问题','auth/invalid-credential':'邮箱或密码错误'};
  return m[code]||code;
}

function accountHTML(){

  envOpened=false;envPull=0;
  document.getElementById('envStage').classList.remove('gone');document.getElementById('envelope').classList.remove('open');document.getElementById('envFlap').style.transform='';
  document.getElementById('envOverlay').classList.add('show');
  const knob=document.getElementById('strKnob');
  let dragging=false,startY=0,basePull=0,moved=0;
  const setPull=p=>{
    envPull=Math.max(0,Math.min(100,p));
    const kx=48+envPull*0.12,ky=116+envPull;
    knob.setAttribute('cx',kx);knob.setAttribute('cy',ky);

      'M114,94 Q'+(84+envPull*0.25)+','+(102+envPull*0.55)+' '+kx+','+ky);

      'rotateX('+(-Math.min(envPull*0.22,24))+'deg)';
    document.getElementById('envHint').style.opacity=String(Math.max(0,.7-envPull/110));
  };
  knob.onpointerdown=e=>{dragging=true;moved=0;startY=e.clientY;basePull=envPull;knob.setPointerCapture&&knob.setPointerCapture(e.pointerId)};
  knob.onpointermove=e=>{
    if(!dragging||envOpened)return;
    const dy=e.clientY-startY;moved=Math.max(moved,Math.abs(dy));
    setPull(basePull+dy);

  knob.onpointerup=()=>{
    if(!dragging)return;dragging=false;

/* 信纸星星雪 */
let snowRAF=null;
function snowStart(){
  const cv=document.getElementById('snowCv');if(!cv)return;
  const ctx=cv.getContext('2d'),ov=document.getElementById('letterOverlay');
  cv.width=ov.clientWidth;cv.height=ov.clientHeight;
  const P=[];
  for(let i=0;i<70;i++){
    const star=Math.random()<0.35;
    P.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:star?2+Math.random()*2.5:1+Math.random()*2,
      vy:star?0.25+Math.random()*0.4:0.5+Math.random()*1.1,
      sway:Math.random()*1.2,ph:Math.random()*6.28,
      o:0.35+Math.random()*0.55,star});
  }
  const tick=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    const t=Date.now()/1000;
    for(const p of P){
      p.y+=p.vy;p.ph+=0.02;
      if(p.y>cv.height+8){p.y=-8;p.x=Math.random()*cv.width}
      const x=p.x+Math.sin(p.ph)*p.sway*14;
      ctx.globalAlpha=p.o*(p.star?(0.55+0.45*Math.sin(t*2.4+p.ph*3)):1);
      ctx.fillStyle='#fff';
      if(p.star){
        const r=p.r*(0.8+0.4*Math.sin(t*2+p.ph));
        ctx.beginPath();
        ctx.moveTo(x,p.y-r*2.2);ctx.quadraticCurveTo(x,p.y,x+r*2.2,p.y);
        ctx.quadraticCurveTo(x,p.y,x,p.y+r*2.2);ctx.quadraticCurveTo(x,p.y,x-r*2.2,p.y);
        ctx.quadraticCurveTo(x,p.y,x,p.y-r*2.2);ctx.fill();
      }else{ctx.beginPath();ctx.arc(x,p.y,p.r,0,6.29);ctx.fill()}
    }
    ctx.globalAlpha=1;
    snowRAF=requestAnimationFrame(tick);
  };
  snowStop();tick();
}
function snowStop(){if(snowRAF)cancelAnimationFrame(snowRAF);snowRAF=null}

/* 照片压缩后转 dataURL，省空间 */
function compressImage(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=800;let w=img.width,h=img.height;
        if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.82));
      };
      img.onerror=()=>res('');
      img.src=e.target.result;
    };
    r.onerror=()=>res('');
    r.readAsDataURL(file);
  });
}

/* 洗牌：把最前面那张甩出去，它绕到最后面；甩出方向跟着手势走 */
function fanCycle(dx,dy){
  const st=document.getElementById('fanStack');if(!st)return;
  const front=st.lastElementChild;if(!front||front.dataset.cyc)return;
  front.dataset.cyc='1';
  front.classList.remove('drag');
  let tx=-112,ty=0,rot=-5;
  if(typeof dx==='number'&&typeof dy==='number'){
    if(Math.abs(dy)>Math.abs(dx)){tx=0;ty=dy<0?-175:175;rot=0}
    else{tx=dx<0?-112:112;rot=dx<0?-5:5}
  }
  front.style.transition='transform .19s ease,opacity .19s ease';
  front.style.transform=`translate(${tx}%,${ty}%) rotate(${rot}deg)`;
  front.style.opacity='0';
  setTimeout(()=>{
    st.prepend(front);
    front.style.transition='none';
    front.style.transform='';front.style.opacity='';
    delete front.dataset.cyc;
    requestAnimationFrame(()=>{front.style.transition=''});
  },195);
}
/* 拖拽翻卡：全方向跟手，rAF 合并每帧只画一次，松手过阈值就按方向甩出去 */
(function(){
  let drag=null,suppress=false,rafId=0,lastDx=0,lastDy=0;
  const stackEl=()=>document.getElementById('fanStack');
  const frontEl=()=>{const s=stackEl();return s?s.lastElementChild:null};
  function applyDrag(){
    rafId=0;
    const f=frontEl();if(!f||!drag)return;
    f.style.transform=`translate(${lastDx}px,${lastDy}px) rotate(${lastDx*0.045}deg)`;
  }
  document.addEventListener('pointerdown',e=>{
    const s=stackEl();
    if(!s||!document.getElementById('addOverlay').classList.contains('show')||!s.contains(e.target))return;
    drag={x:e.clientX,y:e.clientY,moved:false};
  });
  document.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>6){
      drag.moved=true;
      const f=frontEl();if(f){f.style.transition='none';f.classList.add('drag')}
    }
    if(drag.moved){
      lastDx=dx;lastDy=dy;suppress=true;
      if(!rafId)rafId=requestAnimationFrame(applyDrag);
    }
  });
  function endDrag(commit){
    if(!drag)return;
    if(rafId){cancelAnimationFrame(rafId);rafId=0}
    const f=frontEl();
    if(f){
      f.classList.remove('drag');
      if(commit&&drag.moved&&Math.max(Math.abs(lastDx),Math.abs(lastDy))>56){fanCycle(lastDx,lastDy)}
      else{f.style.transition='';f.style.transform=''}
    }
    drag=null;
    if(suppress)setTimeout(()=>{suppress=false},60);
  }
  document.addEventListener('pointerup',()=>endDrag(true));
  document.addEventListener('pointercancel',()=>endDrag(false));
  document.addEventListener('click',e=>{
    if(suppress){e.stopPropagation();e.preventDefault();suppress=false}
  },true);
})();

function delItem(key,id){
  const names={cards:'这张小卡',orders:'这条切卡记录',carpools:'这次拼车',merch:'这个周边',concerts:'这场演唱会',wishlist:'这条心愿'};
  if(!confirm(`确定删除${names[key]}吗？`))return;
  DB[key]=DB[key].filter(x=>x.id!==id);saveDB();render();toast('已删除');
}

/* ============ 切卡详情：组员 + 卡片 + 补邮分账 ============ */
const MEMBER_COLORS=['#f5f5f7','#c7c7cc','#aeaeb2','#8e8e93','#6e6e73','#545456','#636366','#3a3a3c'];
const CARD_ST={pending:['待付','st-pending'],paid:['已付','st-paid'],postage_due:['待补邮','st-postage'],shipped:['已发货','st-shipped']};
const CARD_ST_ORDER=['pending','paid','postage_due','shipped'];

function omembers(o){if(!o.members)o.members=[];return o.members}
function ocards(o){if(!o.cards)o.cards=[];return o.cards}
function omem(o,mid){return omembers(o).find(m=>m.id===mid)}
function fmtSplit(n){return '¥'+(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2})}

function renderOrderDetail(id){
  const o=DB.orders.find(x=>x.id===id);if(!o){goTab('orders');return}
  omembers(o);ocards(o);
  if(!o.postage)o.postage={total:0,paid:{}};
  const total=+o.postage.total||0;
  const per=o.members.length&&total>0?total/o.members.length:0;
  document.getElementById('app').innerHTML=`
    <div class="toolbar">
      <button class="btn ghost" onclick="goTab('orders')">← 返回</button>
      <button class="btn ghost" onclick="editOrder('${o.id}')">编辑团信息</button>
    </div>
    <div class="section-title">${esc(o.title)}</div>
    <p class="hint">${esc(o.items||'')}${o.amount?' · '+yen(o.amount):''} · ${esc(o.status)}${o.date?' · '+esc(o.date):''}</p>

    <div class="section-title">组员</div>
    <div class="legend">
      ${o.members.map(m=>`<div class="member-chip"><span class="dot" style="background:${m.color}"></span>${esc(m.name)}<span class="x" role="button" tabindex="0" aria-label="删除" onclick="delMember('${o.id}','${m.id}')">×</span></div>`).join('')}
      <button class="btn small ghost" onclick="addMember('${o.id}')">+ 添加组员</button>
    </div>

    <div class="section-title">卡片 <span class="hint">— 点状态可切换</span></div>
    ${o.cards.length?`<div class="ocard-list">`+o.cards.map(c=>{
      const mem=omem(o,c.memberId),col=mem?mem.color:'#8e8e93',nm=mem?mem.name:'?';
      const [txt,cls]=CARD_ST[c.status]||CARD_ST.pending;
      return `<div class="ocard">
        <div class="stripe" style="background:${col}"></div>
        <div class="ocard-body">
          <div class="ocard-title">${esc(c.title)}</div>
          <div class="ocard-meta"><span class="dot" style="background:${col}"></span>${esc(nm)}${c.price?' · '+yen(c.price):''}</div>
        </div>
        <span class="status-badge ${cls}" onclick="cycleCardStatus('${o.id}','${c.id}')">${txt}</span>
        <span class="x" role="button" tabindex="0" aria-label="删除" onclick="delOrderCard('${o.id}','${c.id}')">×</span>
      </div>`}).join('')+`</div>`:`<div class="empty">还没有卡片，先添加组员再记卡吧</div>`}
    <div class="toolbar"><button class="btn small" onclick="addOrderCard('${o.id}')">+ 添加卡片</button></div>

    <div class="section-title">补邮分账</div>
    <div class="split-box">
      <div class="toolbar t0">
        <input type="number" id="postageInput" placeholder="输入补邮总额 ¥" min="0" value="${total||''}" style="flex:1;min-width:140px">
        <button class="btn small" onclick="calcPostage('${o.id}')">平分</button>
        <button class="btn small ghost" onclick="resetPaid('${o.id}')">重置</button>
      </div>
      ${total>0&&o.members.length?`<div class="pay-grid">`+o.members.map(m=>{
        const paid=!!o.postage.paid[m.id];
        return `<div class="pay-card ${paid?'paid':''}" style="${paid?`border-color:${m.color}`:''}" onclick="togglePaid('${o.id}','${m.id}')">
          <span class="dot" style="background:${m.color}"></span>
          <div class="pay-name">${esc(m.name)}</div>
          <div class="pay-amt">${fmtSplit(per)}</div>
          <div class="pay-check" style="color:${paid?m.color:'var(--muted)'}">${paid?'已付':'待付'}</div>
        </div>`}).join('')+`</div>`
      :`<p class="hint">输入补邮总额并平分，点击组员卡片标记已付 / 未付</p>`}
    </div>`;
  applyI18n();
}

function addMember(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const name=prompt('组员名字：');if(!name||!name.trim())return;
  const used=omembers(o).map(m=>m.color);
  const color=MEMBER_COLORS.find(c=>!used.includes(c))||MEMBER_COLORS[o.members.length%MEMBER_COLORS.length];
  o.members.push({id:uid(),name:name.trim(),color});
  saveDB();renderOrderDetail(oid);toast('已添加组员');
}
function delMember(oid,mid){
  const o=DB.orders.find(x=>x.id===oid);
  if(ocards(o).some(c=>c.memberId===mid)){toast('这位组员还有卡片，先删卡片');return}
  if(!confirm('删除这位组员？'))return;
  o.members=o.members.filter(m=>m.id!==mid);
  delete o.postage.paid[mid];
  saveDB();renderOrderDetail(oid);toast('已删除');
}
function addOrderCard(oid){
  const o=DB.orders.find(x=>x.id===oid);
  if(!omembers(o).length){toast('先添加组员');return}
  openModal('添加卡片',`
    <label>卡片名称 *</label><input id="f_title" placeholder="例：NCT Dream 限量小卡">
    <div class="row2">
      <div><label>所属组员</label><select id="f_member">${o.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
      <div><label>价格 (¥)</label><input id="f_price" type="number" min="0"></div>
    </div>
    <label>状态</label><select id="f_status">${Object.entries(CARD_ST).map(([k,[t]])=>`<option value="${k}">${t}</option>`).join('')}</select>
  `,()=>{
    const title=val('f_title');if(!title){toast('名称不能为空');return false}
    o.cards.unshift({id:uid(),title,memberId:val('f_member'),price:+val('f_price')||0,status:val('f_status')});
    saveDB();renderOrderDetail(oid);toast('已添加');return true;
  });
}
function cycleCardStatus(oid,cid){
  const o=DB.orders.find(x=>x.id===oid);
  const c=o.cards.find(x=>x.id===cid);
  c.status=CARD_ST_ORDER[(CARD_ST_ORDER.indexOf(c.status)+1)%CARD_ST_ORDER.length];
  saveDB();renderOrderDetail(oid);
}
function delOrderCard(oid,cid){
  const o=DB.orders.find(x=>x.id===oid);
  if(!confirm('删除这张卡片？'))return;
  o.cards=o.cards.filter(c=>c.id!==cid);saveDB();renderOrderDetail(oid);toast('已删除');
}
function calcPostage(oid){
  const o=DB.orders.find(x=>x.id===oid);
  const v=parseFloat(document.getElementById('postageInput').value);
  if(isNaN(v)||v<=0){toast('输入有效的补邮金额');return}
  if(!omembers(o).length){toast('先添加组员');return}
  o.postage.total=v;saveDB();renderOrderDetail(oid);
  toast('已平分，每人 '+fmtSplit(v/o.members.length));
}
function togglePaid(oid,mid){
  const o=DB.orders.find(x=>x.id===oid);
  o.postage.paid[mid]=!o.postage.paid[mid];
  saveDB();renderOrderDetail(oid);
}
function resetPaid(oid){
  const o=DB.orders.find(x=>x.id===oid);
  o.postage.paid={};saveDB();renderOrderDetail(oid);toast('已重置支付状态');
}
function editOrder(id){
const o=id?DB.orders.find(x=>x.id===id):{status:'拼团中'};
openModal(id?'编辑切卡记录':'添加切卡记录',`
<label>团名 / 标题 *</label><input id="f_title" value="${esc(o.title||'')}" placeholder="例：9月韩网切卡团">
<label>参与的卡</label><input id="f_items" value="${esc(o.items||'')}" placeholder="例：成员A 初雪特典卡 ×2">
<div class="row2">
<div><label>金额 (¥)</label><input id="f_amount" type="number" min="0" value="${o.amount||''}"></div>
<div><label>状态</label><select id="f_status">${ORDER_STATUS.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
</div>
<label>日期</label>${dateFieldHTML('f_date',o.date||'')}
<label>备注</label><textarea id="f_note" placeholder="团长、转运单号…">${esc(o.note||'')}</textarea>
`,()=>{
const title=val('f_title');if(!title){toast('标题不能为空');return false}
Object.assign(o,{title,items:val('f_items'),amount:+val('f_amount')||0,status:val('f_status'),date:val('f_date'),note:val('f_note')});
if(!id){o.id=uid();DB.orders.unshift(o)}
saveDB();renderOrders();toast(id?'已更新':'已添加');return true;
});
}

/* ============ 拼车（拼转运 / 拼邮） ============ */
const CARPOOL_STATUS=['拼车中','已发货','已到货','已完成'];
function cmembers(cp){if(!cp.members)cp.members=[];return cp.members}
function cparcels(cp){if(!cp.parcels)cp.parcels=[];return cp.parcels}
function cmem(cp,mid){return cmembers(cp).find(m=>m.id===mid)}
function cship(cp){if(!cp.shipping)cp.shipping={total:0,paid:{}};return cp.shipping}

function renderCarpools(){
  document.getElementById('app').innerHTML=`
    <div class="toolbar"><button class="btn" onclick="editCarpool()">+ 发起拼车</button></div>

function addCarMember(cid){
  const cp=DB.carpools.find(x=>x.id===cid);

const CONCERT_STATUS={wanna:'想去',ticket:'已买票',done:'已参加'};

function concertDays(d){
  if(!d)return'日期待定';
  const t=new Date();t.setHours(0,0,0,0);
  const n=Math.round((new Date(d+'T00:00:00')-t)/86400000);
  if(n>0)return`还有 ${n} 天`;
  if(n===0)return'就是今天';
  return`已结束 ${-n} 天`;
}
function concertSort(a,b){
  const t=new Date();t.setHours(0,0,0,0);
  const rk=c=>{if(!c.date)return 1;return new Date(c.date+'T00:00:00')>=t?0:2};
  const r=rk(a)-rk(b);if(r)return r;
  if(a.date&&b.date)return rk(a)===2?(a.date<b.date?1:-1):(a.date<b.date?-1:1);
  return 0;
}

/* ============ 从表格文档导入 ============ */
let docRows=[];
function openDocImport(){
  openModal('从表格文档导入',
    '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">把 Excel / WPS / 备忘录里的表格复制后粘贴进来（带表头最好：图片、卡片名字、状态、金额）。图片粘贴不过来，导入后在小卡里补传照片就行。</div>'
    +'<label>粘贴表格内容</label>'
    +'<textarea id="docText" rows="9" placeholder="图片\t卡片名字\t状态\t金额\n\t初雪特典卡\t已拥有\t¥45"></textarea>',
    ()=>{
      const t=val('docText');
      if(!t){toast('先粘贴表格内容');return false}
      docRows=parseDocTable(t);
      if(!docRows.length){toast('没解析出有效行，检查下格式');return false}
      renderDocPreview();
      return false;
    });
  document.getElementById('modalOk').textContent='开始解析';
}
function parsePrice(s){
  if(s==null)return null;
  const m=String(s).replace(/,/g,'').match(/(\d+(?:\.\d+)?)/);
  return m?+m[1]:null;
}
function normStatus(s){
  s=String(s||'');
  if(/求购|想收|想要|蹲|收卡/.test(s))return 'wanted';
  if(/在售|出售|出物|待出/.test(s))return 'own';
  if(/已出|卖掉|已卖|售出/.test(s))return 'own';
  return 'own';
}
function parseDocTable(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!/^\|[\s\-|:]+\|$/.test(l.trim()));
  if(!lines.length)return [];
  const splitRow=l=>{
    if(l.includes('\t'))return l.split('\t').map(s=>s.trim());
    if(l.includes('|')){let p=l.split('|').map(s=>s.trim());if(!p[0])p=p.slice(1);if(p.length&&!p[p.length-1])p=p.slice(0,-1);return p}
    if(l.includes('，')||l.includes(','))return l.split(/，|,/).map(s=>s.trim());
    if(/ {2,}/.test(l))return l.split(/ {2,}/).map(s=>s.trim());
    return [l];
  };
  const rows=lines.map(splitRow).filter(r=>r.length&&r.some(c=>c));
  if(!rows.length)return [];
  const keys={name:['名字','名称','卡名','卡片','标题','品名'],
    status:['状态'],price:['金额','价格','价','¥','￥','元'],
    member:['成员','人物']};
  let colMap=null,startIdx=0;
  if(/名字|名称|卡名|状态|金额|价格|图片|照片/.test(rows[0].join(' '))){
    colMap={};
    rows[0].forEach((c,i)=>{for(const k in keys){if(keys[k].some(w=>c.includes(w))&&colMap[k]===undefined)colMap[k]=i}});
    startIdx=1;
  }
  const out=[];
  const isNumCol=c=>/^[¥￥\d\s.,，]+$/.test(c)&&/\d/.test(c);
  for(let i=startIdx;i<rows.length;i++){
    const cols=rows[i];
    let name='',statusRaw='',priceRaw='',member='';
    if(colMap){
      name=cols[colMap.name]||'';
      statusRaw=colMap.status!==undefined?cols[colMap.status]||'':'';
      priceRaw=colMap.price!==undefined?cols[colMap.price]||'':'';
      member=colMap.member!==undefined?cols[colMap.member]||'':'';
      if(!name)name=(cols.filter(c=>c&&!isNumCol(c)).sort((a,b)=>b.length-a.length)[0]||'');
    }else{
      let pi=-1,si=-1;
      cols.forEach((c,idx)=>{
        if(pi<0&&/[¥￥]/.test(c))pi=idx;
        if(si<0&&/拥有|已收|求购|想收|在售|出售|已出|卖掉|持有/.test(c))si=idx;
      });
      if(pi<0){const ni=cols.findIndex(isNumCol);if(ni>=0)pi=ni}
      priceRaw=pi>=0?cols[pi]:'';
      statusRaw=si>=0?cols[si]:'';
      name=(cols.filter((c,idx)=>idx!==pi&&idx!==si&&c&&!isNumCol(c)).sort((a,b)=>b.length-a.length)[0]||cols[0]||'');
    }
    const price=parsePrice(priceRaw);
    if(!name&&price==null)continue;
    out.push({type:'card',name:name||'(未命名)',member:member,status:normStatus(statusRaw),price:price||0,checked:true});
  }
  return out;
}
function renderDocPreview(){
  const typeOpts={card:'小卡',order:'切卡',merch:'周边',wish:'心愿单'};
  const stOpts={own:'已拥有',wanted:'求购中'};
  document.getElementById('modalTitle').textContent='确认导入（'+docRows.length+' 条）';
  let h='<div style="font-size:13px;color:var(--muted);margin-bottom:8px">核对一下，勾选要导入的行，分类和状态都能改：</div>';
  docRows.forEach((r,i)=>{
    h+='<div class="imp-row'+(r.checked?'':' off')+'" data-i="'+i+'">'
      +'<input type="checkbox"'+(r.checked?' checked':'')+' onchange="docRows['+i+'].checked=this.checked;this.closest(\'.imp-row\').classList.toggle(\'off\',!this.checked)">'
      +'<select onchange="docRows['+i+'].type=this.value">'+Object.keys(typeOpts).map(k=>'<option value="'+k+'"'+(r.type===k?' selected':'')+'>'+typeOpts[k]+'</option>').join('')+'</select>'
      +'<input type="text" value="'+esc(r.name)+'" oninput="docRows['+i+'].name=this.value" placeholder="名字">'
      +'<input type="text" value="'+esc(r.member)+'" oninput="docRows['+i+'].member=this.value" placeholder="成员" style="max-width:64px;flex:0 1 64px">'
      +'<select onchange="docRows['+i+'].status=this.value">'+Object.keys(stOpts).map(k=>'<option value="'+k+'"'+(r.status===k?' selected':'')+'>'+stOpts[k]+'</option>').join('')+'</select>'
      +'<input type="number" value="'+(r.price||'')+'" oninput="docRows['+i+'].price=+this.value||0" placeholder="¥">'
      +'</div>';
  });
  document.getElementById('modalBody').innerHTML=h;
  const ok=document.getElementById('modalOk');
  ok.textContent='确认导入';
  ok.onclick=()=>{confirmDocImport()};
  applyI18n();
}
function confirmDocImport(){
  const rows=docRows.filter(r=>r.checked&&String(r.name).trim());
  if(!rows.length){toast('没有勾选任何行');return}
  let n=0;
  for(const r of rows){
    const name=String(r.name).trim(),price=+r.price||0,member=String(r.member||'').trim();
    if(r.type==='order')DB.orders.push({id:uid(),title:name,items:'',amount:price,status:'拼团中',date:'',note:'从表格导入',members:[],cards:[],postage:{total:0,paid:{}}});
    else if(r.type==='merch')DB.merch.push({id:uid(),name:name,type:'周边',price:price,channel:'',date:'',note:'从表格导入',photo:''});
    else if(r.type==='wish')DB.wishlist.push({id:uid(),name:name,member:member,album:'',targetPrice:price,note:'从表格导入'});
    else DB.cards.push({id:uid(),name:name,member:member,album:'',version:'',price:price,status:r.status||'own',channel:'',date:'',note:'从表格导入',photo:''});
    n++;
  }
  saveDB();closeModal();render();toast('已导入 '+n+' 条记录');
}

function trText(s){
  if(LANG==='zh'||s==null)return s;
  s=String(s);
  const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!m||!m[2])return s;
  const d=DICT[LANG]||{};
  let out=d[m[2]];
  if(out===undefined){
    out=m[2];
    for(const [re,rp] of (PAT[LANG]||[]))out=out.replace(re,rp);
  }
  return m[1]+out+m[3];
}
const _origText=new WeakMap(),_origAttr=new WeakMap();
function applyI18n(){
  if(typeof document==='undefined'||!document.body||typeof NodeFilter==='undefined')return;
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p||p.closest('script,style,pre,#letterText'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const ns=[];let nd;while((nd=w.nextNode()))ns.push(nd);
  const attrs=['placeholder','aria-label','title','alt'];
  if(LANG==='zh'){
    /* 切回中文：动态内容已由 render 重画，这里只还原写死在页面里的静态文字 */
    for(const t of ns){const o=_origText.get(t);if(o!==undefined&&t.nodeValue!==o)t.nodeValue=o}
    document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(el=>{
      const m=_origAttr.get(el);if(!m)return;
      for(const a of attrs){if(m[a]!==undefined&&el.getAttribute(a)!==m[a])el.setAttribute(a,m[a])}
    });
  }else{
    for(const t of ns){
      if(!_origText.has(t))_origText.set(t,t.nodeValue);
      const v=trText(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v;
    }
    document.querySelectorAll('[placeholder],[aria-label],[title],[alt]').forEach(el=>{
      for(const a of attrs){
        if(el.hasAttribute&&el.hasAttribute(a)){
          let m=_origAttr.get(el);if(!m){m={};_origAttr.set(el,m)}
          if(m[a]===undefined)m[a]=el.getAttribute(a);
          const cur=el.getAttribute(a),v=trText(cur);if(v!==cur)el.setAttribute(a,v);
        }
      }
    });
  }
  if(typeof moveInd==='function')moveInd();
}
let i18nTick=false;
function queueI18n(){if(LANG==='zh'||i18nTick)return;i18nTick=true;requestAnimationFrame(()=>{i18nTick=false;applyI18n()})}
if(typeof MutationObserver!=='undefined'&&typeof document!=='undefined'&&document.body)
  new MutationObserver(queueI18n).observe(document.body,{childList:true,subtree:true});
const _cf=window.confirm,_pr=window.prompt;
window.confirm=m=>_cf(trText(m==null?'':String(m)));
window.prompt=(m,d)=>_pr(trText(m==null?'':String(m)),d);
function setLang(l){
  LANG=l;DB.settings.lang=l;saveDB();
  document.documentElement.lang=l==='zh'?'zh-CN':l;
  renderTabs();render();applyI18n();
}
document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
if(typeof requestAnimationFrame!=='undefined')requestAnimationFrame(()=>applyI18n());

});
